</head><body><canvas id="c"></canvas>
<script>
// ======================================================================
//  Quiroga Digital — promo. Pantallas = capturas reales de la app (repo
//  quiroga-app) con datos de demostración. Todo lo demás se dibuja aquí.
// ======================================================================
const Q = new URLSearchParams(location.search), V = (Q.get('fmt') || 'v') === 'v';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080, CX = W / 2, CY = H / 2, FPS = 60, DUR = TLD.dur;
const C = { AZUL: '#002068', AZUL2: '#003399', AZUL3: '#001040', ROSA: '#e2007c', ROSA2: '#b50062', ROJO: '#ba1a1a', BLANCO: '#ffffff',
  AMA: '#f6a800', VERDE: '#3aa935', ROJO2: '#e30613', CELESTE: '#0077c8', TXT: '#1a1c1e' };
const PETAL = [C.ROSA, C.AMA, C.VERDE, C.ROJO2, C.CELESTE];
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const out = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const sceneCv = mk(), accCv = mk(), sc = sceneCv.getContext('2d'), acc = accCv.getContext('2d');

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t, prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outC: t => 1 - Math.pow(1 - t, 3), inOutC: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t), inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutQ: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 9 - .75) * (2 * Math.PI / 3)) + 1,
};
function hash(n) { let x = (Math.floor(n) | 0) ^ 0x9E3779B9; x = Math.imul(x ^ (x >>> 16), 0x85EBCA6B); x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function font(c, s, w = 800, fam = 'Jak') { c.font = `${w} ${s}px ${fam}`; }
function icon(c, ch, x, y, s, col) { c.font = `900 ${s}px FA`; c.fillStyle = col; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch, x, y); }
const FA = { phone: '', comment: '', camera: '', image: '', map: '', clock: '', cal: '', gear: '',
  wifi: '', signal: '', battery: '', tri: '', flag: '', bullhorn: '', truck: '', comments: '', shield: '',
  user: '', pin: '', bell: '', search: '', chrome: '', music: '', mail: '', play: '', star: '', check: '' };

// ---------------------------------------------------------------- assets (lazy)
const IMG = {}, PEND = {};
function load(src) { if (IMG[src]) return Promise.resolve(); if (!PEND[src]) PEND[src] = new Promise(res => { const im = new Image(); im.onload = () => { IMG[src] = im; res(); }; im.onerror = () => res(); im.src = src; }); return PEND[src]; }
const A = '../build/assets/';
const scr = n => A + 'screens/' + META[n].file;
const spl = i => A + 'splash/s_' + String(clamp(i, 1, 184) | 0).padStart(3, '0') + '.jpg';
function evict(keep) { const ks = Object.keys(IMG).filter(k => k.includes('/screens/') || k.includes('/splash/')); if (ks.length > 40) for (const k of ks) if (!keep.has(k)) { delete IMG[k]; delete PEND[k]; } }

// ---------------------------------------------------------------- screen schedule (src/timeline.json)
const SB = 28;                      // status bar (css px)
const SW = 412, SH = 892 + SB;      // phone screen in css px
const S = TLD.screens;
const isAuth = n => /^(SPLASH|HOME|login|reg_|sms_|splash)/.test(n);
const rectOf = (n, k) => { const r = META[n] && META[n].rects[k]; return r ? [r[0], r[1] + SB] : [206, 460]; };
var HOME_ICON = TLD.home_icon;
const TAPS = TLD.taps;
const T_OPEN = S.find(x => x[1] === 'SPLASH')[0];
const T_HOMEW = S.find(x => x[1] === 'HOME_W')[0];
const T_OUTRO = 72.5, T_INTRO = 5.0;

// ---------------------------------------------------------------- Android home (drawn)
const APPS = [['Teléfono', '#34a853', 'phone'], ['Mensajes', '#1a73e8', 'comment'], ['Cámara', '#5f6368', 'camera'], ['Galería', '#f9ab00', 'image'],
  ['Mapas', '#0f9d58', 'map'], ['Reloj', '#3c4043', 'clock'], ['Calendario', '#e94235', 'cal'], ['Ajustes', '#607d8b', 'gear'],
  ['Correo', '#ea4335', 'mail'], ['Música', '#ff6d00', 'music'], ['QUIROGA', null, null], ['Navegador', '#4285f4', 'search']];
function drawHome(c, t, widget) {
  const g = c.createLinearGradient(0, 0, SW, SH); g.addColorStop(0, '#001b5e'); g.addColorStop(0.55, '#3b1a7a'); g.addColorStop(1, '#b50062');
  c.fillStyle = g; c.fillRect(0, 0, SW, SH);
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  font(c, 76, 300); c.fillText('10:30', SW / 2, 170); font(c, 17, 600); c.fillText('lunes, 9 de noviembre', SW / 2, 202);
  font(c, 13, 600); c.globalAlpha = 0.8; c.fillText('☀  22°  Quiroga, Mich.', SW / 2, 230); c.globalAlpha = 1;
  if (widget) {
    const wp = E.outBack(prog(t, T_HOMEW + 0.4, T_HOMEW + 1.1), 1.4);
    c.save(); c.translate(SW / 2, 330); c.scale(wp, wp);
    c.fillStyle = 'rgba(0,0,0,0.25)'; rr(c, -170, -36, 340, 76, 16); c.fill();
    c.fillStyle = C.ROJO; rr(c, -172, -40, 344, 76, 16); c.fill();
    icon(c, FA.tri, -110, -2, 22, '#fff'); font(c, 20, 800); c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('ALERTA MUJER', -88, -1);
    c.restore();
    font(c, 11, 600); c.fillStyle = 'rgba(255,255,255,0.75)'; c.textAlign = 'center'; c.fillText('Widget · Quiroga', SW / 2, 384);
  }
  APPS.forEach((a, i) => {
    const col = i % 4, row = Math.floor(i / 4), x = 34 + col * 92, y = 420 + row * 104;
    if (a[1]) { c.fillStyle = a[1]; rr(c, x, y, 60, 60, 16); c.fill(); icon(c, FA[a[2]], x + 30, y + 31, 26, '#fff'); }
    else if (IMG[A + 'icon.png']) { c.save(); rr(c, x, y, 60, 60, 16); c.clip(); c.drawImage(IMG[A + 'icon.png'], x, y, 60, 60); c.restore(); }
    font(c, 12, 600); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillText(a[0] === 'QUIROGA' ? 'Quiroga' : a[0], x + 30, y + 80);
  });
  // dock
  c.fillStyle = 'rgba(255,255,255,0.16)'; rr(c, 22, SH - 118, SW - 44, 84, 28); c.fill();
  [['#34a853', 'phone'], ['#1a73e8', 'comment'], ['#4285f4', 'search'], ['#5f6368', 'camera']].forEach(([col, ic], i) => { const x = 46 + i * 92; c.fillStyle = col; rr(c, x, SH - 106, 60, 60, 16); c.fill(); icon(c, FA[ic], x + 30, SH - 75, 26, '#fff'); });
  // long-press shortcut menu (widget scene)
  if (widget) {
    const mp = E.outBack(prog(t, T_HOMEW + 2.35, T_HOMEW + 2.8), 1.4) * (1 - prog(t, T_HOMEW + 4.6, T_HOMEW + 4.95));
    if (mp > 0) {
      const [ix, iy] = HOME_ICON;
      c.save(); c.translate(ix + 30, iy - 12); c.scale(mp, mp);
      c.fillStyle = 'rgba(0,0,0,0.25)'; rr(c, -110, -84, 220, 70, 14); c.fill();
      c.fillStyle = '#fff'; rr(c, -112, -88, 224, 70, 14); c.fill();
      c.fillStyle = 'rgba(186,26,26,0.12)'; rr(c, -98, -76, 40, 40, 10); c.fill(); icon(c, FA.tri, -78, -55, 18, C.ROJO);
      font(c, 15, 800); c.fillStyle = C.TXT; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('Alerta Mujer', -48, -62); font(c, 11, 600); c.fillStyle = '#666'; c.fillText('Acceso directo', -48, -44);
      c.restore();
    }
  }
}

// ---------------------------------------------------------------- phone screen content
function idxAt(t) { let i = -1; for (let k = 0; k < S.length; k++) if (S[k][0] <= t) i = k; return i; }
function drawShot(c, name, t, dy = 0) {
  if (name === 'HOME' || name === 'HOME_W') { drawHome(c, t, name === 'HOME_W'); return; }
  if (name === 'SPLASH') {
    const im = IMG[scr('splash')]; if (im) c.drawImage(im, 0, SB, SW, 892);
    c.fillStyle = '#0D2B7E'; c.fillRect(0, 0, SW, SB);
    const r = META.splash.rects.card, vf = IMG[spl(splashFrame(t))];
    if (vf) { c.save(); rr(c, r[0] - r[2] / 2, r[1] - r[3] / 2 + SB, r[2], r[3], 14); c.clip(); c.drawImage(vf, r[0] - r[2] / 2, r[1] - r[3] / 2 + SB, r[2], r[3]); c.restore(); }
    return;
  }
  const im = IMG[scr(name)]; if (!im) return;
  c.drawImage(im, 0, SB - dy, SW, 892);
}
const splashFrame = t => 1 + (0.3 + (t - T_OPEN - 0.1) * 2.2) * 30;
function statusBar(c, name) {
  const dark = !isAuth(name) || name.startsWith('reg_') || name.startsWith('sms_');
  const auth = isAuth(name) && !name.startsWith('HOME');
  c.fillStyle = name.startsWith('HOME') ? 'rgba(0,0,0,0)' : (auth && !(name.startsWith('reg_') || name.startsWith('sms_')) ? '#0D2B7E' : '#ffffff');
  if (name === 'login') c.fillStyle = '#002068';
  if (name.startsWith('reg_') || name.startsWith('sms_')) c.fillStyle = '#f9f9fc';
  c.fillRect(0, 0, SW, SB);
  const col = (c.fillStyle === '#ffffff' || c.fillStyle === '#f9f9fc') ? '#1a1c1e' : '#ffffff';
  font(c, 13, 700); c.fillStyle = col; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('10:30', 22, SB / 2 + 1);
  icon(c, FA.signal, SW - 78, SB / 2, 11, col); icon(c, FA.wifi, SW - 58, SB / 2, 11, col); icon(c, FA.battery, SW - 32, SB / 2, 13, col);
}
function drawScreen(c, t) {
  const i = idxAt(t); if (i < 0) return;
  const [t0, name, tr, o] = S[i], prev = i > 0 ? S[i - 1][1] : null, lt = t - t0;
  c.save(); c.beginPath(); c.rect(0, 0, SW, SH); c.clip();
  c.fillStyle = '#f9f9fc'; c.fillRect(0, 0, SW, SH);
  const D = { cut: 0.07, fade: 0.45, slide: 0.6, up: 0.7, scroll: 0.85, open: 0.8, none: 0 }[tr] || 0;
  const p = D ? clamp(lt / D) : 1;
  if (p < 1 && prev) {
    if (tr === 'slide') { const e = E.outExpo(p); c.save(); c.translate(-SW * 0.3 * e, 0); drawShot(c, prev, t); c.fillStyle = `rgba(0,0,0,${0.25 * e})`; c.fillRect(0, 0, SW, SH); c.restore(); c.save(); c.translate(SW * (1 - e), 0); drawShot(c, name, t); c.restore(); }
    else if (tr === 'up') { const e = E.outExpo(p); drawShot(c, prev, t); c.save(); c.translate(0, SH * (1 - e)); drawShot(c, name, t); c.restore(); }
    else if (tr === 'scroll') {
      const e = E.inOutC(p), dy = o.dy || 200;
      c.save(); c.translate(0, -dy * e); drawShot(c, prev, t); c.restore(); c.save(); c.translate(0, dy * (1 - e)); drawShot(c, name, t); c.restore();
      const im = IMG[scr(name)]; if (im) { c.drawImage(im, 0, 0, 1236, 61 * 3, 0, SB, SW, 61); c.drawImage(im, 0, 828 * 3, 1236, 64 * 3, 0, SB + 828, SW, 64); }
    }
    else if (tr === 'open') {
      drawShot(c, prev, t);
      const e = E.inOutC(clamp(p * 1.4)), [ix, iy] = HOME_ICON;
      const x = lerp(ix, 0, e), y = lerp(iy, 0, e), w = lerp(60, SW, e), h = lerp(60, SH, e);
      c.save(); rr(c, x, y, w, h, lerp(16, 0, e)); c.clip(); c.fillStyle = '#0D2B7E'; c.fillRect(0, 0, SW, SH);
      c.globalAlpha = clamp((p - 0.45) / 0.55); drawShot(c, name, t); c.restore();
      if (e < 0.6 && IMG[A + 'icon.png']) { c.save(); c.globalAlpha = 1 - e / 0.6; c.drawImage(IMG[A + 'icon.png'], x + w / 2 - w * 0.55, y + h / 2 - h * 0.55, w * 1.1, h * 1.1); c.restore(); }
    }
    else { drawShot(c, prev, t); c.globalAlpha = tr === 'cut' ? p : E.inOutQ(p); drawShot(c, name, t); c.globalAlpha = 1; }
  } else drawShot(c, name, t);
  statusBar(c, name);
  c.restore();
}

// ---------------------------------------------------------------- phone + camera
const LAY = V ? { pcx: 540, pcy: 1120, sh: 1250 } : { pcx: 1290, pcy: 548, sh: 900 };
LAY.sc = LAY.sh / SH; LAY.sw = SW * LAY.sc;
function camera(t) {
  const Z = { Z1: V ? 1.25 : 1.3, Z2: V ? 1.36 : 1.42, Z3: V ? 1.08 : 1.12 };
  const K = TLD.camera.map(([tk, z, x, y]) => [tk, typeof z === 'string' ? Z[z] : z, x, y]);
  if (t <= K[0][0] || t >= K[K.length - 1][0]) return { s: 1, fx: SW / 2, fy: SH / 2 };
  let k = 0; while (K[k + 1][0] < t) k++;
  const [ta, sa, xa, ya] = K[k], [tb, sb, xb, yb] = K[k + 1], e = E.inOutC(prog(t, ta, tb));
  return { s: lerp(sa, sb, e), fx: lerp(xa, xb, e), fy: lerp(ya, yb, e) };
}
function phoneEnter(t) { // 0..1 entry, plus exit at outro
  const a = E.outExpo(prog(t, 4.3, 5.6)), b = E.inOutC(prog(t, T_OUTRO - 0.3, T_OUTRO + 0.6));
  return { y: (1 - a) * H * 0.9 + b * H * 1.0, rot: (1 - a) * 0.12 - b * 0.06, vis: a > 0 && b < 1 };
}
function drawPhone(c, t) {
  const pe = phoneEnter(t); if (!pe.vis) return;
  const cam = camera(t), s = LAY.sc * cam.s;
  const ox = LAY.pcx - (cam.fx - SW / 2) * (cam.s - 1) * LAY.sc, oy = LAY.pcy - (cam.fy - SH / 2) * (cam.s - 1) * LAY.sc + pe.y;
  c.save(); c.translate(ox, oy); c.rotate(pe.rot); c.scale(s, s);
  // body
  const bz = 13, R = 52;
  c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 60; c.shadowOffsetY = 30;
  c.fillStyle = '#0d0d12'; rr(c, -SW / 2 - bz, -SH / 2 - bz, SW + bz * 2, SH + bz * 2, R + bz); c.fill();
  c.shadowColor = 'transparent';
  const g = c.createLinearGradient(-SW / 2, 0, SW / 2, 0); g.addColorStop(0, '#3a3d48'); g.addColorStop(0.5, '#1b1c22'); g.addColorStop(1, '#3a3d48');
  c.strokeStyle = g; c.lineWidth = 3; rr(c, -SW / 2 - bz + 1.5, -SH / 2 - bz + 1.5, SW + bz * 2 - 3, SH + bz * 2 - 3, R + bz - 1.5); c.stroke();
  c.fillStyle = '#26272e'; rr(c, SW / 2 + bz - 1, -SH / 2 + 150, 4, 70, 2); c.fill(); rr(c, SW / 2 + bz - 1, -SH / 2 + 240, 4, 44, 2); c.fill();
  // screen
  c.save(); rr(c, -SW / 2, -SH / 2, SW, SH, R); c.clip(); c.translate(-SW / 2, -SH / 2);
  drawScreen(c, t); drawTouches(c, t);
  // glass reflection
  const gl = c.createLinearGradient(0, 0, SW, SH); gl.addColorStop(0, 'rgba(255,255,255,0.07)'); gl.addColorStop(0.45, 'rgba(255,255,255,0)'); c.fillStyle = gl; c.fillRect(0, 0, SW, SH);
  c.restore();
  c.fillStyle = '#05050a'; c.beginPath(); c.arc(0, -SH / 2 + SB / 2, 7, 0, 7); c.fill();
  c.restore();
}
function drawTouches(c, t) {
  for (const [t0, x, y, hold] of TAPS) {
    const end = hold || t0 + 0.08, lt = t - t0;
    if (t < t0 - 0.25 || t > end + 0.5) continue;
    const appear = E.outBack(prog(t, t0 - 0.22, t0), 2), release = prog(t, end, end + 0.35);
    const r = 26 * appear * (1 - 0.15 * prog(t, t0, t0 + 0.06)) * (1 - release);
    if (r > 0.5) { c.fillStyle = `rgba(255,255,255,${0.55 * (1 - release)})`; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.strokeStyle = `rgba(226,0,124,${0.9 * (1 - release)})`; c.lineWidth = 3; c.stroke(); }
    if (lt > 0 && lt < 0.6 && !hold) { const e = E.outC(lt / 0.6); c.strokeStyle = `rgba(226,0,124,${0.7 * (1 - e)})`; c.lineWidth = 4 * (1 - e) + 1; c.beginPath(); c.arc(x, y, 26 + 50 * e, 0, 7); c.stroke(); }
    if (hold && t >= t0 + 0.5 && t <= hold + 0.3) {
      const hp = clamp((t - t0 - 0.5) / (hold - t0 - 0.5));
      c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 7; c.beginPath(); c.arc(x, y, 44, 0, 7); c.stroke();
      c.strokeStyle = C.ROSA; c.lineCap = 'round'; c.beginPath(); c.arc(x, y, 44, -Math.PI / 2, -Math.PI / 2 + hp * Math.PI * 2); c.stroke(); c.lineCap = 'butt';
      const pulse = (t * 2.2) % 1; c.strokeStyle = `rgba(186,26,26,${0.6 * (1 - pulse)})`; c.lineWidth = 3; c.beginPath(); c.arc(x, y, 50 + pulse * 70, 0, 7); c.stroke();
    }
  }
}

// ---------------------------------------------------------------- otomí motifs (vector, drawn in code)
function petalShape(c, s) { c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(s * 0.55, -s * 0.25, s * 0.45, -s * 0.95, 0, -s); c.bezierCurveTo(-s * 0.45, -s * 0.95, -s * 0.55, -s * 0.25, 0, 0); c.closePath(); }
function flower(c, x, y, s, col, col2, open = 1, rot = 0, n = 8) {
  if (open <= 0) return;
  c.save(); c.translate(x, y); c.rotate(rot + (1 - open) * 0.8);
  for (let i = 0; i < n; i++) { c.save(); c.rotate(i / n * Math.PI * 2); c.scale(open, open); petalShape(c, s); c.fillStyle = col; c.fill(); c.restore(); }
  c.fillStyle = col2; c.beginPath(); c.arc(0, 0, s * 0.32 * open, 0, 7); c.fill();
  c.fillStyle = col; c.beginPath(); c.arc(0, 0, s * 0.13 * open, 0, 7); c.fill();
  c.restore();
}
function leaf(c, x, y, s, rot, col, g = 1) { if (g <= 0) return; c.save(); c.translate(x, y); c.rotate(rot); c.scale(g, g); petalShape(c, s); c.fillStyle = col; c.fill(); c.restore(); }
function swirl(c, x, y, r, rot, col, g = 1, w = 4) {
  if (g <= 0) return; c.save(); c.translate(x, y); c.rotate(rot); c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath();
  const turns = 1.6 * g; for (let a = 0; a <= turns * Math.PI * 2; a += 0.12) { const rr2 = r * (1 - a / (Math.PI * 2 * 2)); const px = Math.cos(a) * rr2, py = Math.sin(a) * rr2; a ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.stroke(); if (g > 0.95) { c.fillStyle = col; c.beginPath(); c.arc(r * 0.18, 0, w * 1.2, 0, 7); c.fill(); } c.restore();
}
// tone-on-tone pattern tile (like the Ayuntamiento backgrounds)
const PAT = (() => {
  const T = 300, cv2 = mk(T * 2, T * 2), x = cv2.getContext('2d'), col = 'rgba(255,255,255,0.055)';
  const motif = (ox, oy) => {
    flower(x, ox + 150, oy + 140, 46, col, 'rgba(255,255,255,0.03)', 1, 0.2);
    for (const [dx, dy, r] of [[60, 230, -2.2], [240, 230, 2.2], [95, 60, -0.7], [205, 60, 0.7], [150, 262, 3.14]]) leaf(x, ox + dx, oy + dy, 42, r, col);
    swirl(x, ox + 40, oy + 140, 34, 0, col, 1, 5); swirl(x, ox + 260, oy + 140, 34, Math.PI, col, 1, 5);
    flower(x, ox + 30, oy + 30, 16, col, col, 1, 0, 6); flower(x, ox + 270, oy + 270, 16, col, col, 1, 0, 6);
  };
  motif(0, 0); motif(T, 0); motif(-T / 2, T); motif(T / 2, T); motif(T * 1.5, T);
  return cv2;
})();
let PATTERN = null;
// garlands of colorful flowers that GROW (no explosion): [x,y (0..1), scale, delay, kind]
const GARLAND = (() => {
  // ornamental corner bouquets: stems curve out of each corner, flowers/leaves/swirls along them

})();

// ---------------------------------------------------------------- background & captions
function alertMix(t) { const a = TLD.caps[3]; return prog(t, a[0], a[0] + 0.8) * (1 - prog(t, a[1] - 0.6, a[1] + 0.2)); }

function brandMark(c, t) {

// ---------------------------------------------------------------- intro & outro (white, Ayuntamiento style, like v1)
function whiteBase(c) {

  c.fillStyle = C.AZUL; c.beginPath(); c.moveTo(0, H); c.lineTo(0, H * 0.82); c.quadraticCurveTo(W * 0.35, H * 0.9, W * 0.55, H); c.fill();
  c.fillStyle = C.ROSA; c.beginPath(); c.moveTo(W, 0); c.lineTo(W, H * 0.14); c.quadraticCurveTo(W * 0.7, H * 0.08, W * 0.55, 0); c.fill();
}
function drawIntro(c, t) {

  c.save(); if (leave > 0) { c.beginPath(); c.rect(0, 0, W, H); c.arc(LAY.pcx, LAY.pcy, Math.hypot(W, H) * leave, 0, 7, true); c.clip(); }

    font(c, V ? 92 : 86, 800); c.fillStyle = C.AZUL; c.fillText('Quiroga Digital', CX, (V ? CY + 210 : CY + 260) + (1 - tp) * 30);
    font(c, 42, 600); c.fillStyle = C.ROSA; c.fillText('La app de tu municipio', CX, (V ? CY + 280 : CY + 325) + (1 - tp) * 30); c.restore(); }
  c.restore();
}
function drawOutro(c, t) {

  const wipe = E.inOutC(prog(lt, 0, 0.9));

// ---------------------------------------------------------------- frame
function drawFrame(c, t) {
  c.save();
  drawBG(c, t);
  if (t < T_INTRO) drawIntro(c, t);
  if (t >= T_INTRO - 0.5 && t < T_OUTRO) { drawCaption(c, t); brandMark(c, t); }
  drawPhone(c, t);
  if (t >= T_OUTRO - 0.2) drawOutro(c, t);
  c.restore();
}
function needed(t) {
  const L = [A + 'logo-blanco.png', A + 'logo-color.png', A + 'icon.png'];
  const i = idxAt(t);
  for (const k of [i, i - 1]) if (k >= 0) { const n = S[k][1]; if (n === 'SPLASH') { L.push(scr('splash'), spl(splashFrame(t))); } else if (META[n]) L.push(scr(n)); }
  return L;
}
async function renderFrame(f) {
  const t = f / FPS, n = 3, sh = 0.5 / FPS, ts = [];
  for (let i = 0; i < n; i++) ts.push(Math.min(DUR - 1e-3, Math.max(0, t + (i / (n - 1) - 0.5) * sh)));
  const keep = new Set(); for (const x of ts) for (const s of needed(x)) keep.add(s);
  await Promise.all([...keep].map(load)); evict(keep);
  for (let i = 0; i < n; i++) { sc.setTransform(1, 0, 0, 1, 0, 0); sc.globalAlpha = 1; drawFrame(sc, ts[i]); acc.globalAlpha = 1 / (i + 1); acc.drawImage(sceneCv, 0, 0); }

window.renderFrame = renderFrame; window.NFRAMES = DUR * FPS;
