<!doctype html>
<html><head><meta charset="utf-8"><title>Sonido y Karaoke</title>
<style>
@font-face{font-family:'Fred';src:url('fonts/Fredoka-Bold.ttf')}
@font-face{font-family:'Nun';src:url('fonts/Nunito-Black.ttf')}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c"></canvas>
<script>
// ============================================================ setup
const Q = new URLSearchParams(location.search);
const FMT = Q.get('fmt') || 'h';
const W = FMT === 'v' ? 1080 : 1920, H = FMT === 'v' ? 1920 : 1080, V = FMT === 'v';
const CX = W / 2, CY = H / 2, FPS = 60;
const BPM = 96, BEAT = 60 / BPM, BAR = BEAT * 4, STEP = BEAT / 4;
const C = { NOCHE: '#0b0620', NOCHE2: '#1a0b3d', MORADO: '#3b0f7a', MAG: '#ff2e93', MAGD: '#b0125f', CIAN: '#16d9ff', AZUL: '#0a4f8a',
  AMA: '#ffd31a', CREMA: '#fff6e8', NAR: '#ff6a1a', ORO: '#f2b632', ORO2: '#c98a12', INK: '#0b0620', PLATA: '#c9cfe0', BLANCO: '#ffffff', ROSA: '#ff8cc6' };
const BRAND = { name1: 'SONIDO', name2: 'Y KARAOKE' };
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const out = cv.getContext('2d');
function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const sceneCv = mk(), accCv = mk(), sc = sceneCv.getContext('2d'), acc = accCv.getContext('2d');
const layCv = mk(1400, 1400), lay = layCv.getContext('2d');
const frmCv = mk(1200, 1200), frm = frmCv.getContext('2d');

// ============================================================ math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outC: t => 1 - Math.pow(1 - t, 3), inOutC: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t), inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 9 - .75) * (2 * Math.PI / 3)) + 1,
};
function hash(n) { let x = (Math.floor(n) | 0) ^ 0x9E3779B9; x = Math.imul(x ^ (x >>> 16), 0x85EBCA6B); x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
const h2 = (a, b) => hash(a * 7919 + b * 104729 + 17);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function noise1(x, s = 0) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i + s * 1013) * 2 - 1, hash(i + 1 + s * 1013) * 2 - 1, u); }

// ============================================================ timeline (12 bars × 2.5 s = 30 s)
const EVENTS = [
  { name: 'CUMPLEAÑOS', icon: 'pastel', bg: C.MORADO, ac: C.MAG, tint: [255, 46, 147] },
  { name: 'BAUTIZOS', icon: 'paloma', bg: C.AZUL, ac: C.CIAN, tint: [22, 217, 255] },
  { name: 'XV AÑOS', icon: 'corona', bg: C.MAGD, ac: C.AMA, tint: [255, 211, 26] },
  { name: 'BODAS', icon: 'anillos', bg: C.NOCHE2, ac: C.ORO, tint: [242, 182, 50] },
];
const TL = [['build'], ['logo'], ['ameni'], ['event', 0], ['event', 1], ['event', 2], ['event', 3], ['cualquier'], ['karaoke', 0], ['karaoke', 1], ['contrata'], ['final']];
const DUR = TL.length * BAR, NFRAMES = Math.round(DUR * FPS);
const KICKS = []; TL.forEach((s, b) => { if (b >= 1 && b <= 10) for (let k = 0; k < 4; k++) KICKS.push(b * BAR + k * BEAT); if (s[0] === 'final') KICKS.push(b * BAR); });
function kickEnv(t, r = 9) { let v = 0; for (const k of KICKS) if (t >= k && t - k < .6) v = Math.max(v, Math.exp(-(t - k) * r) * (((k / BEAT) % 2 < 0.01) ? 1 : 0.6)); return v; }
const LASERS = [STEP * 0, STEP * 6, STEP * 10]; for (let b = 1; b <= 10; b++) if (b % 2 === 0) LASERS.push(b * BAR + 14 * STEP);
function bgOf(seg) { if (seg[0] === 'event') return EVENTS[seg[1]].bg; return { build: C.NOCHE, logo: C.NOCHE, ameni: C.MAG, cualquier: C.AMA, karaoke: C.NOCHE, contrata: C.MORADO, final: C.NOCHE }[seg[0]]; }

// ============================================================ text
function font(c, size, fam) { c.font = `${size}px ${fam}`; }
function measure(c, s, size, fam, tr = 0) { font(c, size, fam); let w = 0; const L = []; for (const ch of s) { const cw = c.measureText(ch).width; L.push({ ch, x: w, w: cw }); w += cw + tr; } return { L, w: w - tr }; }
function fit(c, s, fam, maxW, maxS, tr = 0) { let sz = maxS; while (sz > 20 && measure(c, s, sz, fam, tr).w > maxW) sz -= 4; return sz; }
function popText(c, s, x, y, size, o = {}) {
  const fam = o.fam || 'Fred', fill = o.fill || C.CREMA, stroke = o.stroke || C.INK, depth = o.depth ?? Math.round(size * 0.06), dcol = o.dcol || C.INK;
  const lw = o.lw ?? size * 0.09;
  font(c, size, fam); c.textAlign = o.align || 'left'; c.textBaseline = 'alphabetic'; c.lineJoin = 'round';
  for (let d = depth; d >= 1; d--) { c.fillStyle = dcol; c.strokeStyle = dcol; c.lineWidth = lw; c.strokeText(s, x + d * 0.7, y + d); c.fillText(s, x + d * 0.7, y + d); }
  if (lw > 0) { c.strokeStyle = stroke; c.lineWidth = lw; c.strokeText(s, x, y); }
  c.fillStyle = fill; c.fillText(s, x, y);
}
function neon(c, s, x, y, size, col, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0) return;
  font(c, size, o.fam || 'Fred'); c.textAlign = o.align || 'center'; c.textBaseline = 'alphabetic'; c.lineJoin = 'round';
  c.save(); c.globalAlpha *= a;
  c.shadowColor = col; c.shadowBlur = size * 0.45; c.strokeStyle = col; c.lineWidth = size * 0.09; c.strokeText(s, x, y);
  c.shadowBlur = size * 0.18; c.fillStyle = col; c.fillText(s, x, y);
  c.shadowBlur = 0; c.fillStyle = 'rgba(255,255,255,0.78)'; c.fillText(s, x, y);
  c.restore();
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function pill(c, s, x, y, size, bg, fg, o = {}) {
  const tr = o.tr ?? size * 0.1; const m = measure(c, s, size, o.fam || 'Nun', tr);
  const pw = m.w + size * 1.3, ph = size * 1.65, px = (o.align === 'left' ? x : x - pw / 2), py = y - ph / 2;
  c.fillStyle = C.INK; rr(c, px + 6, py + 8, pw, ph, ph / 2); c.fill();
  c.fillStyle = bg; rr(c, px, py, pw, ph, ph / 2); c.fill(); c.strokeStyle = C.INK; c.lineWidth = 5; c.stroke();
  c.fillStyle = fg; c.textBaseline = 'middle'; c.textAlign = 'left'; font(c, size, o.fam || 'Nun');
  for (const g of m.L) c.fillText(g.ch, px + size * 0.65 + g.x, y + size * 0.06);
  c.textBaseline = 'alphabetic'; return pw;
}

// ============================================================ textures & lights
const DOTS = (() => { const p = mk(28, 28), x = p.getContext('2d'); x.fillStyle = 'rgba(0,0,0,0.10)'; x.beginPath(); x.arc(7, 7, 3.2, 0, 7); x.arc(21, 21, 3.2, 0, 7); x.fill(); return p; })();
let DOTPAT = null;
const GRAIN = []; for (let g = 0; g < 3; g++) { const cv2 = mk(W / 2, H / 2), x = cv2.getContext('2d'), id = x.createImageData(W / 2, H / 2), r = mulberry(g + 3); for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() + r() - 1) * 110; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); GRAIN.push(cv2); }
function bg(c, col, rays = 0, t = 0, rx = CX, ry = CY, raycol = '#fff') {
  c.fillStyle = col; c.fillRect(-300, -300, W + 600, H + 600);
  if (rays > 0) {
    c.save(); c.translate(rx, ry); c.rotate(t * 0.2); c.globalAlpha = rays; c.fillStyle = raycol; const n = 24, R = Math.hypot(W, H);
    for (let k = 0; k < n; k += 2) { const a0 = k / n * Math.PI * 2, a1 = (k + 1) / n * Math.PI * 2; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a0) * R, Math.sin(a0) * R); c.lineTo(Math.cos(a1) * R, Math.sin(a1) * R); c.closePath(); c.fill(); }
    c.restore();
  }
  if (!DOTPAT) DOTPAT = c.createPattern(DOTS, 'repeat');
  c.fillStyle = DOTPAT; c.fillRect(-300, -300, W + 600, H + 600);
}
// moving-head light beams from the top rig
const BEAM_COLS = [[255, 46, 147], [22, 217, 255], [255, 211, 26], [140, 80, 255]];
function beams(c, t, on = 1, n = 6, ww = W, hh = H, ox = 0, oy = 0) {
  if (on <= 0) return;
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const vis = clamp(on * n - i); if (vis <= 0) continue;
    const x = ox + (i + 0.5) / n * ww, y = oy - 10;
    const a = Math.PI / 2 + Math.sin(t * (0.9 + (i % 3) * 0.25) + i * 1.7) * 0.55;
    const L = hh * 1.35, spread = 0.09;
    const col = BEAM_COLS[i % 4];
    const g = c.createLinearGradient(x, y, x + Math.cos(a) * L, y + Math.sin(a) * L);
    g.addColorStop(0, `rgba(${col},${0.55 * vis})`); g.addColorStop(0.6, `rgba(${col},${0.14 * vis})`); g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g; c.beginPath(); c.moveTo(x, y);
    c.lineTo(x + Math.cos(a - spread) * L, y + Math.sin(a - spread) * L); c.lineTo(x + Math.cos(a + spread) * L, y + Math.sin(a + spread) * L); c.closePath(); c.fill();
    c.fillStyle = `rgba(${col},${0.9 * vis})`; c.beginPath(); c.arc(x, y + 6, 14, 0, 7); c.fill();
  }
  c.restore();
}
function lasers(c, t, ww = W, hh = H) { // sonidero laser zaps synced with the audio
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const lt0 of LASERS) {
    const e = t - lt0; if (e < 0 || e > 0.35) continue;
    const a = Math.exp(-e * 7), r = mulberry(Math.floor(lt0 * 100));
    for (let k = 0; k < 7; k++) {
      const y0 = r() * hh * 0.3, y1 = hh * (0.3 + r() * 0.7), x0 = r() * ww, x1 = r() * ww;
      const col = k % 2 ? '22,217,255' : '120,255,90';
      c.strokeStyle = `rgba(${col},${a})`; c.lineWidth = 4; c.shadowColor = `rgb(${col})`; c.shadowBlur = 16;
      const p = E.outExpo(clamp(e / 0.12));
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(lerp(x0, x1, p), lerp(y0, y1, p)); c.stroke();
    }
  }
  c.restore();
}
function discoBall(c, x, y, R, t) {
  c.save(); c.strokeStyle = C.PLATA; c.lineWidth = 3; c.beginPath(); c.moveTo(x, -50); c.lineTo(x, y - R); c.stroke();
  c.beginPath(); c.arc(x, y, R, 0, 7); c.fillStyle = '#5a5f78'; c.fill(); c.save(); c.clip();
  const rows = 10, rot = t * 0.8;
  for (let j = 0; j < rows; j++) {
    const la0 = -Math.PI / 2 + j / rows * Math.PI, la1 = la0 + Math.PI / rows, yy0 = y + Math.sin(la0) * R, yy1 = y + Math.sin(la1) * R;
    const cols = 16;
    for (let i = 0; i < cols; i++) {
      const lo = (i / cols) * Math.PI * 2 + rot, lo1 = lo + Math.PI * 2 / cols;
      if (Math.cos(lo + Math.PI / cols) < 0) continue;
      const rr0 = Math.cos((la0 + la1) / 2) * R;
      const xa = x + Math.sin(lo) * rr0, xb = x + Math.sin(lo1) * rr0;
      const sh = 0.45 + 0.55 * Math.cos(lo + Math.PI / cols - 0.6) * Math.cos((la0 + la1) / 2 + 0.5);
      const sp = h2(i + Math.floor(rot * 3), j) > 0.93 ? 1 : 0;
      c.fillStyle = sp ? '#ffffff' : `rgb(${150 * sh + 60},${155 * sh + 60},${185 * sh + 60})`;
      c.fillRect(Math.min(xa, xb) + 1, yy0 + 1, Math.abs(xb - xa) - 2, yy1 - yy0 - 2);
    }
  }
  c.restore(); c.strokeStyle = C.INK; c.lineWidth = 5; c.beginPath(); c.arc(x, y, R, 0, 7); c.stroke();
  c.restore();
}
function specks(c, t, x, y, n = 70, a = 0.8) { // light dots thrown by the disco ball
  c.save(); c.globalCompositeOperation = 'lighter';
  const r = mulberry(5);
  for (let i = 0; i < n; i++) {
    const ang = r() * Math.PI * 2 + t * 0.5, d = 150 + r() * Math.hypot(W, H) * 0.6;
    const px = x + Math.cos(ang) * d, py = y + Math.sin(ang) * d * 0.8 + 100;
    const col = BEAM_COLS[i % 4]; c.fillStyle = `rgba(${col},${a * (0.4 + 0.6 * Math.abs(Math.sin(t * 3 + i)))})`;
    c.beginPath(); c.arc(px, py, 4 + r() * 6, 0, 7); c.fill();
  }
  c.restore();
}

// ============================================================ illustrations
function stk(c, w = 9) { c.strokeStyle = C.INK; c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
function speaker(c, t, kb) {
  rr(c, -150, -280, 300, 560, 28); c.fillStyle = '#1b1430'; c.fill(); stk(c, 10);
  rr(c, -126, -256, 252, 512, 18); c.fillStyle = '#120c22'; c.fill();
  c.save(); rr(c, -126, -256, 252, 512, 18); c.clip(); c.strokeStyle = 'rgba(255,255,255,0.05)'; c.lineWidth = 2;
  for (let x = -130; x < 130; x += 10) { c.beginPath(); c.moveTo(x, -260); c.lineTo(x, 260); c.stroke(); } c.restore();
  // horn
  rr(c, -90, -230, 180, 110, 20); c.fillStyle = '#2a2244'; c.fill(); stk(c, 6);
  c.beginPath(); c.ellipse(0, -175, 60, 34, 0, 0, 7); c.fillStyle = '#0a0614'; c.fill(); stk(c, 5);
  // woofer
  const p = 1 + 0.09 * kb;
  for (const [r0, col] of [[118, '#2a2244'], [104, '#3a3060'], [80 * p, '#151025'], [34 * p, '#3a3060']]) { c.beginPath(); c.arc(0, 90, r0, 0, 7); c.fillStyle = col; c.fill(); stk(c, 5); }
  c.fillStyle = 'rgba(255,255,255,0.18)'; c.beginPath(); c.arc(-16, 74, 12 * p, 0, 7); c.fill();
  // neon edge strip pulses
  c.save(); c.shadowColor = C.MAG; c.shadowBlur = 20 + 30 * kb; c.strokeStyle = C.MAG; c.lineWidth = 6; rr(c, -138, -268, 276, 536, 24); c.stroke(); c.restore();
}
function mic(c, t) {
  c.save(); c.rotate(-0.35);
  c.beginPath(); c.moveTo(-46, 40); c.lineTo(46, 40); c.lineTo(26, 330); c.quadraticCurveTo(0, 350, -26, 330); c.closePath(); c.fillStyle = '#1b1430'; c.fill(); stk(c, 9);
  c.fillStyle = C.MAG; c.fillRect(-36, 150, 72, 22); c.strokeStyle = C.INK; c.lineWidth = 5; c.strokeRect(-36, 150, 72, 22);
  rr(c, -58, 10, 116, 44, 12); c.fillStyle = C.PLATA; c.fill(); stk(c, 7);
  c.beginPath(); c.arc(0, -70, 100, 0, 7); c.fillStyle = '#aab1c8'; c.fill();
  c.save(); c.beginPath(); c.arc(0, -70, 100, 0, 7); c.clip(); c.strokeStyle = '#6b7290'; c.lineWidth = 4;
  for (let k = -110; k <= 110; k += 18) { c.beginPath(); c.moveTo(k - 120, -190); c.lineTo(k + 120, 50); c.stroke(); c.beginPath(); c.moveTo(k + 120, -190); c.lineTo(k - 120, 50); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,0.55)'; c.beginPath(); c.ellipse(-38, -112, 30, 18, -0.6, 0, 7); c.fill(); c.restore();
  c.beginPath(); c.arc(0, -70, 100, 0, 7); stk(c, 9);
  c.restore();
}
const ICONS = {
  pastel(c, t) {
    c.beginPath(); c.ellipse(0, 215, 260, 40, 0, 0, 7); c.fillStyle = C.PLATA; c.fill(); stk(c, 7);
    rr(c, -210, 40, 420, 180, 26); c.fillStyle = C.ROSA; c.fill(); stk(c);
    const drips = (x0, x1, y, col) => { c.beginPath(); c.moveTo(x0, y - 10); for (let x = x0; x <= x1; x += 35) { const d = 26 + 20 * Math.abs(Math.sin(x * 0.13)); c.lineTo(x, y + d); c.arc(x + 17, y + d, 17, Math.PI, 0, true); } c.lineTo(x1, y - 10); c.closePath(); c.fillStyle = col; c.fill(); stk(c, 6); };
    drips(-210, 210, 50, C.CREMA);
    rr(c, -135, -95, 270, 150, 22); c.fillStyle = C.CREMA; c.fill(); stk(c);
    drips(-135, 135, -85, C.MAG);
    const r = mulberry(3); for (let i = 0; i < 26; i++) { c.fillStyle = BEAM_COLS[i % 4].length ? `rgb(${BEAM_COLS[i % 4]})` : '#fff'; c.save(); c.translate(-190 + r() * 380, 110 + r() * 90); c.rotate(r() * 3); c.fillRect(-8, -3, 16, 6); c.restore(); }
    for (let k = -1; k <= 1; k++) {
      const x = k * 75; rr(c, x - 11, -190, 22, 100, 6); c.fillStyle = k ? C.CIAN : C.AMA; c.fill(); stk(c, 5);
      const fl = 1 + 0.15 * Math.sin(t * 22 + k * 2);
      c.save(); c.translate(x, -205); c.scale(fl, 2 - fl); c.beginPath(); c.moveTo(0, -38); c.quadraticCurveTo(24, -6, 0, 12); c.quadraticCurveTo(-24, -6, 0, -38); c.fillStyle = C.NAR; c.fill(); stk(c, 4);
      c.beginPath(); c.moveTo(0, -18); c.quadraticCurveTo(10, -2, 0, 6); c.quadraticCurveTo(-10, -2, 0, -18); c.fillStyle = C.AMA; c.fill(); c.restore();
    }
  },
  paloma(c, t) {
    c.save(); c.globalAlpha = 0.5; c.strokeStyle = C.AMA; c.lineWidth = 8;
    for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2 + t * 0.4; c.beginPath(); c.moveTo(Math.cos(a) * 200, Math.sin(a) * 200); c.lineTo(Math.cos(a) * 250, Math.sin(a) * 250); c.stroke(); } c.restore();
    const fl = Math.sin(t * 9) * 0.35;
    c.save(); c.translate(-10, -20); c.rotate(-0.4 + fl); c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(-60, -170, -220, -230, -250, -160); c.bezierCurveTo(-200, -120, -180, -60, -150, -40); c.bezierCurveTo(-110, -20, -60, 0, 0, 0);
    c.fillStyle = '#e9f1ff'; c.fill(); stk(c, 8); c.restore();
    c.beginPath(); c.moveTo(-170, 40); c.bezierCurveTo(-100, -40, 80, -60, 150, -10); c.bezierCurveTo(170, 30, 120, 90, 40, 90); c.bezierCurveTo(-40, 90, -110, 80, -170, 40); c.fillStyle = C.BLANCO; c.fill(); stk(c, 8);
    c.beginPath(); c.moveTo(-160, 40); c.lineTo(-260, 10); c.lineTo(-250, 60); c.lineTo(-270, 90); c.lineTo(-150, 70); c.closePath(); c.fillStyle = C.BLANCO; c.fill(); stk(c, 7);
    c.beginPath(); c.arc(150, -30, 52, 0, 7); c.fillStyle = C.BLANCO; c.fill(); stk(c, 8);
    c.beginPath(); c.moveTo(196, -40); c.lineTo(240, -26); c.lineTo(196, -14); c.closePath(); c.fillStyle = C.NAR; c.fill(); stk(c, 5);
    c.fillStyle = C.INK; c.beginPath(); c.arc(165, -42, 8, 0, 7); c.fill();
    c.save(); c.translate(-10, -10); c.rotate(0.3 - fl); c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(40, -170, 200, -240, 240, -170); c.bezierCurveTo(190, -130, 160, -60, 120, -40); c.bezierCurveTo(80, -20, 40, 0, 0, 0);
    c.fillStyle = C.BLANCO; c.fill(); stk(c, 8); c.strokeStyle = '#c7d6f2'; c.lineWidth = 5; for (let k = 1; k < 4; k++) { c.beginPath(); c.moveTo(40 * k, -40 * k + 10); c.lineTo(60 * k + 30, -50 * k - 20); c.stroke(); } c.restore();
    c.strokeStyle = '#2f9e44'; c.lineWidth = 7; c.beginPath(); c.moveTo(225, -20); c.quadraticCurveTo(270, 10, 300, 0); c.stroke();
    for (const [x, y] of [[255, 2], [280, -2]]) { c.beginPath(); c.ellipse(x, y - 14, 14, 7, -0.5, 0, 7); c.fillStyle = '#7bc043'; c.fill(); stk(c, 4); }
  },
  corona(c, t) {
