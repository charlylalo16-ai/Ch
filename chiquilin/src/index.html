<style>

</style></head><body><canvas id="c"></canvas>
<script>
// ============================================================ setup
const Q = new URLSearchParams(location.search);
const PIECE = Q.get('piece') || 'menu', FMT = Q.get('fmt') || 'h';
const W = FMT === 'v' ? 1080 : 1920, H = FMT === 'v' ? 1920 : 1080, V = FMT === 'v';
const CX = W / 2, CY = H / 2, FPS = 60;
const BPM = 128, BEAT = 60 / BPM, BAR = BEAT * 4, STEP = BEAT / 4;
const C = { ROJO: '#c0131b', ROJOD: '#8b0e14', AMA: '#f5c800', AMAD: '#c9a200', CAFE: '#1a0800', CAFE2: '#3d1600', CAFE3: '#6a2e00',
  CREMA: '#fff9ee', NAR: '#e65100', VERDE: '#1a7a3a', ORO: '#e9a23b', ORO2: '#c97a1f', CARNE: '#7a2410', CARNE2: '#a8361a', QUESO: '#ffd84a', BARRO: '#c4622d', BLANCO: '#ffffff' };
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const out = cv.getContext('2d');
function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const sceneCv = mk(), accCv = mk(), sc = sceneCv.getContext('2d'), acc = accCv.getContext('2d');
const layCv = mk(1400, 1400), lay = layCv.getContext('2d');

// ============================================================ math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outC: t => 1 - Math.pow(1 - t, 3), inOutC: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t), inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 9 - .75) * (2 * Math.PI / 3)) + 1,
  outBounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; },
};
function hash(n) { let x = (Math.floor(n) | 0) ^ 0x9E3779B9; x = Math.imul(x ^ (x >>> 16), 0x85EBCA6B); x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
const h2 = (a, b) => hash(a * 7919 + b * 104729 + 17);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function noise1(x, s = 0) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i + s * 1013) * 2 - 1, hash(i + 1 + s * 1013) * 2 - 1, u); }

// ============================================================ timeline
const DATA = {
  phone: '443 198 2156', days: ['SÁBADOS Y', 'DOMINGOS'], hours: 'DESDE LAS 9 AM',
  products: [
    { name: ['TACOS', 'SUAVES'], short: 'TACOS SUAVES', price: '$18', ill: 'suave', bg: C.ROJO, fg: C.CREMA, ac: C.AMA },
    { name: ['TACOS', 'DORADOS'], short: 'TACOS DORADOS', price: '$21', ill: 'taco', bg: C.CAFE, fg: C.CREMA, ac: C.AMA },
    { name: ['VOLCANES'], short: 'VOLCANES', price: '$21', ill: 'volcan', bg: C.AMA, fg: C.CAFE, ac: C.ROJO },
    { name: ['CONSOMÉ'], short: 'CONSOMÉ', price: '$10', ill: 'consome', bg: C.CREMA, fg: C.CAFE, ac: C.ROJO },
  ],
};
const TL = {
  menu: [['intro'], ['prod', 0], ['prod', 1], ['prod', 2], ['prod', 3], ['lista'], ['info'], ['final', '¡TE ESPERAMOS!']],
  intro: [['intro'], ['final', null]],
  cierre: [['info'], ['final', '¡TE ESPERAMOS!']],
}[PIECE];
const DUR = TL.length * BAR, NFRAMES = Math.round(DUR * FPS);
const KICKS = [];
TL.forEach((s, b) => { if (s[0] === 'prod' || s[0] === 'lista' || s[0] === 'espera' || s[0] === 'info') for (let k = 0; k < 4; k++) KICKS.push(b * BAR + k * BEAT); if (s[0] === 'final') KICKS.push(b * BAR); });
function kickEnv(t, r = 10) { let v = 0; for (const k of KICKS) if (t >= k && t - k < .5) v = Math.max(v, Math.exp(-(t - k) * r)); return v; }
function bgOf(seg) { if (seg[0] === 'prod') return DATA.products[seg[1]].bg; return { intro: C.CREMA, lista: C.CAFE, final: C.CAFE, espera: C.ROJO, info: C.ROJO }[seg[0]]; }

// ============================================================ text
function font(c, size, fam) { c.font = `${size}px ${fam}`; }
function measure(c, s, size, fam, tr = 0) { font(c, size, fam); let w = 0; const L = []; for (const ch of s) { const cw = c.measureText(ch).width; L.push({ ch, x: w, w: cw }); w += cw + tr; } return { L, w: w - tr }; }
function fit(c, s, fam, maxW, maxS, tr = 0) { let sz = maxS; while (sz > 20 && measure(c, s, sz, fam, tr).w > maxW) sz -= 4; return sz; }
// chunky sticker type: extrude + outline + fill
function popText(c, s, x, y, size, o = {}) {
  const fam = o.fam || 'Fred', fill = o.fill || C.CREMA, stroke = o.stroke || C.CAFE, depth = o.depth ?? Math.round(size * 0.06), dcol = o.dcol || C.CAFE;
  const lw = o.lw ?? size * 0.09;
  font(c, size, fam); c.textAlign = o.align || 'left'; c.textBaseline = 'alphabetic'; c.lineJoin = 'round';
  for (let d = depth; d >= 1; d--) { c.fillStyle = dcol; c.strokeStyle = dcol; c.lineWidth = lw; c.strokeText(s, x + d * 0.7, y + d); c.fillText(s, x + d * 0.7, y + d); }
  if (lw > 0) { c.strokeStyle = stroke; c.lineWidth = lw; c.strokeText(s, x, y); }
  c.fillStyle = fill; c.fillText(s, x, y);
}
function pill(c, s, x, y, size, bg, fg, o = {}) {
  font(c, size, o.fam || 'Nun'); const tr = o.tr ?? size * 0.12; const m = measure(c, s, size, o.fam || 'Nun', tr);
  const pw = m.w + size * 1.3, ph = size * 1.65, px = (o.align === 'left' ? x : x - pw / 2), py = y - ph / 2;
  c.fillStyle = C.CAFE; rr(c, px + 6, py + 8, pw, ph, ph / 2); c.fill();
  c.fillStyle = bg; rr(c, px, py, pw, ph, ph / 2); c.fill();
  c.strokeStyle = C.CAFE; c.lineWidth = 5; c.stroke();
  c.fillStyle = fg; c.textBaseline = 'middle'; c.textAlign = 'left';
  for (const g of m.L) c.fillText(g.ch, px + size * 0.65 + g.x, y + size * 0.06);
  c.textBaseline = 'alphabetic';
  return pw;
}
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// ============================================================ textures
const DOTS = (() => { const p = mk(28, 28), x = p.getContext('2d'); x.fillStyle = 'rgba(0,0,0,0.07)'; x.beginPath(); x.arc(7, 7, 3.2, 0, 7); x.arc(21, 21, 3.2, 0, 7); x.fill(); return p; })();
let DOTPAT = null;
const GRAIN = []; for (let g = 0; g < 3; g++) { const cv2 = mk(W / 2, H / 2), x = cv2.getContext('2d'), id = x.createImageData(W / 2, H / 2), r = mulberry(g + 3); for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() + r() - 1) * 110; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); GRAIN.push(cv2); }
function bg(c, col, rays = 0.0, t = 0, rx = CX, ry = CY, raycol = 'rgba(255,255,255,1)') {
  c.fillStyle = col; c.fillRect(-300, -300, W + 600, H + 600);
  if (rays > 0) {
    c.save(); c.translate(rx, ry); c.rotate(t * 0.18); c.globalAlpha = rays; c.fillStyle = raycol;
    const n = 24, R = Math.hypot(W, H);
    for (let k = 0; k < n; k += 2) { const a0 = k / n * Math.PI * 2, a1 = (k + 1) / n * Math.PI * 2; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a0) * R, Math.sin(a0) * R); c.lineTo(Math.cos(a1) * R, Math.sin(a1) * R); c.closePath(); c.fill(); }
    c.restore();
  }
  if (!DOTPAT) DOTPAT = c.createPattern(DOTS, 'repeat');
  c.fillStyle = DOTPAT; c.fillRect(-300, -300, W + 600, H + 600);
}

// ============================================================ papel picado
const FLAG_W = 150, FLAG_H = 180;
const FLAG_COLS = [C.ROJO, C.AMA, C.VERDE, C.NAR, '#e0367a', '#1565c0'];
const FLAGS = FLAG_COLS.map((col, ci) => {
  const f = mk(FLAG_W, FLAG_H), x = f.getContext('2d');
  x.fillStyle = col; x.beginPath(); x.moveTo(0, 0); x.lineTo(FLAG_W, 0); x.lineTo(FLAG_W, FLAG_H - 22);
  for (let i = 10; i >= 0; i--) { const px = i / 10 * FLAG_W; x.lineTo(px, FLAG_H - (i % 2 ? 0 : 22)); }
  x.closePath(); x.fill();
  x.globalCompositeOperation = 'destination-out';
  // cut-outs: border dots, center flower, diamonds
  for (let i = 0; i < 9; i++) { x.beginPath(); x.arc(12 + i * 15.8, 14, 4, 0, 7); x.fill(); }
  const fx = FLAG_W / 2, fy = 82;
  for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; x.beginPath(); x.ellipse(fx + Math.cos(a) * 26, fy + Math.sin(a) * 26, 12, 6, a, 0, 7); x.fill(); }
  x.beginPath(); x.arc(fx, fy, 9, 0, 7); x.fill();
  for (const [dx, dy] of [[24, 40], [FLAG_W - 24, 40], [24, 124], [FLAG_W - 24, 124]]) { x.beginPath(); x.moveTo(dx, dy - 11); x.lineTo(dx + 8, dy); x.lineTo(dx, dy + 11); x.lineTo(dx - 8, dy); x.closePath(); x.fill(); }
  if (ci % 2) for (let i = 0; i < 5; i++) { x.fillRect(18 + i * 26, 140, 12, 6); }
  else { x.beginPath(); x.arc(fx, 138, 10, Math.PI, 0); x.fill(); }
  return f;
});
const CUTS = TL.map((_, b) => b * BAR).filter(x => x > 0);
function papel(c, t, drop = 0, alpha = 1) {
  const sp = FLAG_W + 26, n = Math.ceil(W / sp) + 1, x0 = (W - (n - 1) * sp) / 2;
  const sag = 34;
  c.save(); c.globalAlpha = alpha;
  const yoff = -260 * (1 - drop);
  // string
  c.strokeStyle = C.CAFE; c.lineWidth = 4; c.beginPath();
  for (let i = 0; i <= 40; i++) { const x = -20 + i / 40 * (W + 40); const u = (x / W) * 2 - 1; const y = 26 + sag * (1 - u * u) + yoff; i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke();
  for (let i = 0; i < n; i++) {
    const x = x0 + i * sp, u = (x / W) * 2 - 1, y = 26 + sag * (1 - u * u) + yoff;
    let th = 0.035 * Math.sin(t * 2.2 + i * 0.9);
    for (const k of CUTS) if (t >= k) th += 0.22 * Math.exp(-(t - k) * 3.2) * Math.sin((t - k) * 10 + i * 0.6);
    const flutter = 1 - 0.12 * Math.abs(Math.sin(t * 3 + i));
    c.save(); c.translate(x, y); c.rotate(th + u * 0.05); c.scale(flutter, 1);
    let fi = i % FLAGS.length; if (FLAG_COLS[fi] === CURBG) fi = (fi + 1) % FLAGS.length;
    c.drawImage(FLAGS[fi], -FLAG_W / 2, 0);
    c.restore();
  }
  c.restore();
}

// ============================================================ illustrations (drawn around 0,0, ~520 px wide at s=1)
function stk(c, w = 9) { c.strokeStyle = C.CAFE; c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
function blobs(c, pts, fill, w = 9) { // union of circles with a single outer outline
  c.fillStyle = C.CAFE; for (const [x, y, r] of pts) { c.beginPath(); c.arc(x, y, r + w / 2, 0, 7); c.fill(); }
  c.fillStyle = fill; for (const [x, y, r] of pts) { c.beginPath(); c.arc(x, y, r - w / 2, 0, 7); c.fill(); }
}
function bits(c, seed, n, x0, x1, yfn, t) { // onion + cilantro confetti on top of the meat
  const r = mulberry(seed);
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, r()), y = yfn(x) + (r() - 0.5) * 30, rot = r() * 3;
    c.save(); c.translate(x, y); c.rotate(rot);
    if (r() > 0.45) { c.fillStyle = C.CREMA; c.fillRect(-7, -7, 14, 14); c.strokeStyle = C.CAFE; c.lineWidth = 3; c.strokeRect(-7, -7, 14, 14); }
    else { c.fillStyle = '#2f9e44'; c.beginPath(); c.ellipse(0, 0, 9, 5, 0, 0, 7); c.fill(); c.strokeStyle = C.CAFE; c.lineWidth = 3; c.stroke(); }
    c.restore();
  }
}
function meat(c, seed, x0, x1, ytop, ybase, t) {
  const r = mulberry(seed), pts = [];
  for (let i = 0; i < 16; i++) { const u = i / 15, x = lerp(x0, x1, u); const hh = Math.sin(u * Math.PI); pts.push([x + (r() - .5) * 20, lerp(ybase, ytop, hh * (0.6 + r() * 0.4)), 26 + r() * 22]); }
  blobs(c, pts, C.CARNE);
  // juicy highlights
  c.fillStyle = C.CARNE2; for (const [x, y, rr2] of pts) { c.beginPath(); c.arc(x - rr2 * 0.25, y - rr2 * 0.3, rr2 * 0.45, 0, 7); c.fill(); }
}
function tacoShell(c, t, wob = 0, soft = false) {
  const SH1 = soft ? '#f6e2b3' : C.ORO, SH2 = soft ? '#e3c78e' : C.ORO2;
  // back lip
  c.beginPath(); c.moveTo(-250, -10); c.quadraticCurveTo(0, -110, 250, -10); c.quadraticCurveTo(0, 45, -250, -10); c.closePath();
  c.fillStyle = SH2; c.fill(); stk(c);
  meat(c, 11, -215, 215, -95, -5, t);
  bits(c, 5, 16, -190, 190, x => -60 - 40 * Math.cos(x / 215 * Math.PI / 2), t);
  // front shell
  c.beginPath(); c.moveTo(-250, -10); c.bezierCurveTo(-255, 205, 255, 205, 250, -10); c.quadraticCurveTo(0, 50 + wob, -250, -10); c.closePath();
  c.fillStyle = SH1; c.fill();
  c.save(); c.clip();
  const r = mulberry(9); c.fillStyle = soft ? 'rgba(201,140,60,0.35)' : C.ORO2;
  for (let i = 0; i < (soft ? 14 : 26); i++) { c.beginPath(); c.ellipse(-220 + r() * 440, 20 + r() * 140, 6 + r() * 12, 4 + r() * 6, r() * 3, 0, 7); c.fill(); }
  c.strokeStyle = 'rgba(255,240,190,0.7)'; c.lineWidth = 10; c.beginPath(); c.moveTo(-200, 40); c.quadraticCurveTo(-170, 140, -60, 160); c.stroke();
  c.restore();
  c.beginPath(); c.moveTo(-250, -10); c.bezierCurveTo(-255, 205, 255, 205, 250, -10); c.quadraticCurveTo(0, 50 + wob, -250, -10); c.closePath(); stk(c, 10);
}
const ILL = {
  taco(c, t) { tacoShell(c, t, Math.sin(t * 6) * 4); },
  suave(c, t) { c.save(); c.rotate(-0.06); tacoShell(c, t + 2, Math.sin(t * 6) * 6, true); c.restore(); },
  sube(c, t) {
    c.save(); c.translate(70, -110); c.scale(0.8, 0.8); c.rotate(0.12); tacoShell(c, t + 1); c.restore();
    c.save(); c.translate(-40, 40); tacoShell(c, t); c.restore();
    // arrow badge
    const b = 1 + 0.08 * Math.sin(t * 8);
    c.save(); c.translate(225, -190); c.scale(b, b);
    c.beginPath(); c.arc(0, 0, 62, 0, 7); c.fillStyle = C.AMA; c.fill(); stk(c, 8);
    c.beginPath(); c.moveTo(0, -36); c.lineTo(30, 0); c.lineTo(12, 0); c.lineTo(12, 34); c.lineTo(-12, 34); c.lineTo(-12, 0); c.lineTo(-30, 0); c.closePath();
    c.fillStyle = C.ROJO; c.fill(); stk(c, 6); c.restore();
  },
  volcan(c, t) {
    // tostada thickness + top
    c.beginPath(); c.ellipse(0, 60, 250, 82, 0, 0, 7); c.fillStyle = C.ORO2; c.fill(); stk(c);
    c.beginPath(); c.ellipse(0, 40, 250, 82, 0, 0, 7); c.fillStyle = C.ORO; c.fill(); stk(c);
    // melted cheese with drips
    const drip = (x, len, w) => { c.beginPath(); c.moveTo(x - w, 40); c.lineTo(x - w, 40 + len); c.arc(x, 40 + len, w, Math.PI, 0, true); c.lineTo(x + w, 40); c.closePath(); };
    c.fillStyle = C.CAFE;
    const dl = [[-170, 70], [-90, 95], [10, 80], [110, 105], [185, 60]];
    for (const [x, l] of dl) { const L = l * (0.85 + 0.15 * Math.sin(t * 3 + x)); drip(x, L + 4, 22); c.fill(); }
    c.beginPath(); c.ellipse(0, 28, 226, 66, 0, 0, 7); c.fill();
    c.fillStyle = C.QUESO;
    for (const [x, l] of dl) { const L = l * (0.85 + 0.15 * Math.sin(t * 3 + x)); drip(x, L, 17); c.fill(); }
    c.beginPath(); c.ellipse(0, 28, 220, 60, 0, 0, 7); c.fill();
    // meat volcano
    const r = mulberry(4), pts = [];
    for (let i = 0; i < 26; i++) { const u = r() * 2 - 1, hgt = (1 - Math.abs(u)) ; pts.push([u * 170, 20 - hgt * (120 + r() * 70) * (0.5 + r() * 0.5), 24 + r() * 18]); }
    blobs(c, pts, C.CARNE);
    c.fillStyle = C.CARNE2; for (const [x, y, q] of pts) { c.beginPath(); c.arc(x - q * .25, y - q * .3, q * .4, 0, 7); c.fill(); }
    // lava salsa on the summit
    c.beginPath(); c.moveTo(-50, -150); c.quadraticCurveTo(0, -200, 50, -150); c.quadraticCurveTo(40, -90, 20, -80); c.quadraticCurveTo(0, -120, -15, -70); c.quadraticCurveTo(-40, -110, -50, -150);
    c.fillStyle = C.ROJO; c.fill(); stk(c, 6);
    bits(c, 8, 12, -150, 150, x => -60 + Math.abs(x) * 0.5, t);
    steam(c, t, -20, -210, 3, 0.8);
  },
  quesadilla(c, t) {
    const pull = 40 + 26 * Math.sin(t * 4);
    const half = (dx, a0, a1) => { c.beginPath(); c.moveTo(dx, 0); c.arc(dx, 0, 240, a0, a1); c.closePath(); };
    // cheese strings between halves
    for (let i = 0; i < 5; i++) {
      const y = -150 + i * 70; c.beginPath(); c.moveTo(-6, y * 0.9); c.bezierCurveTo(pull * 0.3, y + 22, pull * 0.7, y + 22, pull, y);
      c.strokeStyle = C.CAFE; c.lineWidth = 18; c.stroke(); c.strokeStyle = C.QUESO; c.lineWidth = 10; c.stroke();
    }
    for (const [dx, a0, a1] of [[-10, Math.PI / 2, Math.PI * 1.5], [pull, -Math.PI / 2, Math.PI / 2]]) {
      // thickness
      c.save(); c.translate(0, 18); half(dx, a0, a1); c.fillStyle = C.ORO2; c.fill(); stk(c); c.restore();
      half(dx, a0, a1); c.fillStyle = '#f1d9a0'; c.fill();
      c.save(); c.clip(); const r = mulberry(dx > 0 ? 3 : 7); c.fillStyle = 'rgba(201,122,31,0.75)';
      for (let i = 0; i < 22; i++) { c.beginPath(); c.ellipse(dx + (r() - 0.5) * 440, (r() - 0.5) * 440, 10 + r() * 16, 6 + r() * 8, r() * 3, 0, 7); c.fill(); }
      c.restore(); half(dx, a0, a1); stk(c, 10);
    }
    // ooze on the cut edges
    c.fillStyle = C.QUESO; c.strokeStyle = C.CAFE; c.lineWidth = 6;
    for (const [x, y, rr2] of [[-12, -60, 16], [-12, 40, 20], [pull + 2, -20, 18], [pull + 2, 110, 14]]) { c.beginPath(); c.arc(x, y, rr2, 0, 7); c.fill(); c.stroke(); }
  },
  consome(c, t, size = 1) {
    c.save(); c.scale(size, size);
    // bowl body
    c.beginPath(); c.moveTo(-230, 0); c.bezierCurveTo(-225, 200, 225, 200, 230, 0); c.closePath(); c.fillStyle = C.BARRO; c.fill();
    c.save(); c.clip(); c.strokeStyle = C.CREMA; c.lineWidth = 8; c.beginPath();
    for (let i = 0; i <= 18; i++) { const x = -230 + i * 26; c.lineTo(x, 70 + (i % 2 ? -18 : 18)); } c.stroke();
    c.fillStyle = 'rgba(0,0,0,0.15)'; c.beginPath(); c.ellipse(140, 120, 120, 90, 0, 0, 7); c.fill(); c.restore();
    c.beginPath(); c.moveTo(-230, 0); c.bezierCurveTo(-225, 200, 225, 200, 230, 0); stk(c, 10);
    c.beginPath(); c.ellipse(0, 182, 90, 18, 0, 0, 7); c.fillStyle = C.CAFE3; c.fill(); stk(c, 8);
