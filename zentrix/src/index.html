<!doctype html>
<html><head><meta charset="utf-8"><title>ZENTRIX SYSTEMS · Intro</title>
<style>
html,body{margin:0;background:#07080B;overflow:hidden}
#bg,#fx{position:absolute;left:0;top:0}
#logo{position:absolute}
#logo svg{width:100%;height:100%;overflow:visible}
</style></head>
<body><canvas id="bg"></canvas><div id="logo"></div><canvas id="fx"></canvas>
<script src="../build/svg.js"></script>
<script>
// Intro v3: animada con el SVG por capas del cliente (cada pieza es vector, sin recortes).
const Q = new URLSearchParams(location.search), V = (Q.get('fmt') || 'h') === 'v';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080, FPS = 60, DUR = 12.0;
const T = { ring0: 0.8, ring1: 3.4, z0: 2.6, zf: 3.5, s0: 3.2, sf: 4.1, acc: 4.55, hit: 4.9, word0: 5.9, word1: 7.5, stu0: 7.5, stu1: 8.8, end: 11.2 };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t, prog = (t, a, b) => clamp((t - a) / (b - a));
const E = { outC: t => 1 - Math.pow(1 - t, 3), inOutS: t => -(Math.cos(Math.PI * t) - 1) / 2, outBack: (t, s = 1.6) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2) };
function hash(n) { let x = (Math.floor(n) | 0) ^ 0x9E3779B9; x = Math.imul(x ^ (x >>> 16), 0x85EBCA6B); x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
const NS = 'http://www.w3.org/2000/svg';
const bg = document.getElementById('bg'), fx = document.getElementById('fx'); [bg, fx].forEach(c => { c.width = W; c.height = H; });
const bc = bg.getContext('2d'), fc = fx.getContext('2d');
const box = document.getElementById('logo'); box.innerHTML = window.SVGTXT; const svg = box.querySelector('svg');
// tamaño del logo en pantalla
const VB = svg.viewBox.baseVal, AR = VB.width / VB.height;
const LWpx = V ? W * 0.86 : H * 0.84 * AR, LHpx = LWpx / AR;
Object.assign(box.style, { width: LWpx + 'px', height: LHpx + 'px', left: (W - LWpx) / 2 + 'px', top: (H - LHpx) / 2 + (V ? -60 : 0) + 'px' });
svg.removeAttribute('width'); svg.removeAttribute('height');
const $ = id => svg.getElementById ? svg.getElementById(id) : svg.querySelector('#' + id);
const L = { back: $('01-orbita-atras'), S: $('02-S'), Z: $('03-Z'), acc: $('04-acento'), front: $('05-orbita-frente'), word: $('06-ZENTRIX'), stu: ($('07-SYSTEMS') || $('07-STUDIO')), lines: $('08-lineas') };
const backPath = L.back.querySelector('path'), frontPath = L.front.querySelector('path');
const lenB = backPath.getTotalLength(), lenF = frontPath.getTotalLength();
// contornos que se dibujan (copias sin relleno)
function outline(src, col, w) { const o = src.cloneNode(); o.removeAttribute('id'); o.setAttribute('fill', 'none'); o.setAttribute('stroke', col); o.setAttribute('stroke-width', w); o.setAttribute('stroke-linejoin', 'round'); src.parentNode.appendChild(o); return o; }
const zPoly = L.Z.querySelector('polygon'), sPath = L.S.querySelector('path');
const zOut = outline(zPoly, '#EAF2FF', 2.4), sOut = outline(sPath, '#7CC8FF', 2.4);
const lenZ = zOut.getTotalLength ? zOut.getTotalLength() : 2000, lenS = sOut.getTotalLength();
// brillo metálico: copias con degradado móvil
const defs = svg.querySelector('defs');
defs.insertAdjacentHTML('beforeend', '<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="120"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>');
const shineG = defs.querySelector('#shine');
function shineCopy(src) { const o = src.cloneNode(); o.removeAttribute('id'); o.setAttribute('fill', 'url(#shine)'); o.style.mixBlendMode = 'screen'; src.parentNode.appendChild(o); return o; }
const zSh = shineCopy(zPoly), sSh = shineCopy(sPath);
// cometa: punto brillante dentro del grupo rotado de la órbita
const backG = backPath.parentNode, frontG = frontPath.parentNode;
function comet(g) { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 9); c.setAttribute('fill', '#ffffff'); c.style.filter = 'drop-shadow(0 0 6px #fff) drop-shadow(0 0 18px #3FB4FF) drop-shadow(0 0 40px #1E6BFF)'; g.appendChild(c); return c; }
const cB = comet(backG), cF = comet(frontG);
// letras
const letters = [...L.word.children];
const bbOf = el => el.getBBox();
const stuLetters = [...L.stu.children].length > 1 ? [...L.stu.children] : [L.stu];
const linesBB = bbOf(L.lines), STB = bbOf(L.stu), midX = VB.x + VB.width / 2;
const PARTS = Array.from({ length: 160 }, (_, i) => [hash(i * 3 + 1), hash(i * 5 + 2), hash(i * 7 + 3), hash(i * 11 + 4)]);

function frame(t) {
  const fade = 1 - E.inOutS(prog(t, T.end, DUR));
  // ---- fondo
  bc.fillStyle = '#07080B'; bc.fillRect(0, 0, W, H);
  const amb = prog(t, 0.2, 2.0) * fade, gl = prog(t, T.hit - 0.2, T.hit + 1.2) * fade;
  const g = bc.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, Math.max(W, H) * 0.75); g.addColorStop(0, `rgba(30,107,255,${0.08 * amb + 0.14 * gl})`); g.addColorStop(1, 'rgba(0,0,0,0)'); bc.fillStyle = g; bc.fillRect(0, 0, W, H);
  for (const [a, b, s, k] of PARTS) { const x = ((a * W + t * (10 + 34 * k)) % (W + 40)) - 20, y = ((b * H - t * (5 + 22 * s)) % H + H) % H;
    bc.fillStyle = `rgba(90,160,255,${(0.1 + 0.4 * s) * amb * (0.6 + 0.4 * Math.sin(t * 2 + k * 9))})`; bc.beginPath(); bc.arc(x, y, 1 + 2 * s, 0, 7); bc.fill(); }
  // ---- cámara (acercamiento lento + sacudida leve en el golpe)
  const zoom = 1 + 0.05 * E.inOutS(prog(t, 0, DUR)), sh = t > T.hit ? 6 * Math.exp(-(t - T.hit) * 6) : 0;
  box.style.transform = `translate(${sh * (hash(t * 60 | 0) - .5)}px,${sh * (hash((t * 60 | 0) + 7) - .5)}px) scale(${zoom})`; box.style.opacity = fade;
  // ---- órbita: se dibuja (atrás y luego enfrente) con cometa
  const rp = E.inOutS(prog(t, T.ring0, T.ring1)), pb = clamp(rp * 2), pf = clamp(rp * 2 - 1);
  for (const [p, path, len, c] of [[pb, backPath, lenB, cB], [pf, frontPath, lenF, cF]]) {
    path.style.strokeDasharray = `${len} ${len}`; path.style.strokeDashoffset = len * (1 - p);
    if (p > 0 && p < 1) { const q = path.getPointAtLength(len * p); c.setAttribute('cx', q.x); c.setAttribute('cy', q.y); c.style.opacity = 1; } else c.style.opacity = 0;
  }
  const glow = t > T.hit ? 0.5 + 0.25 * Math.sin((t - T.hit) * 2.2) : 0.35 * clamp(rp * 3);
  L.front.style.filter = L.back.style.filter = `drop-shadow(0 0 ${4 + 10 * glow}px rgba(30,107,255,${0.9 * glow}))`;
  // ---- Z: contorno que se dibuja y luego se rellena
  const zd = E.inOutS(prog(t, T.z0, T.z0 + 1.2)), zfp = E.outC(prog(t, T.zf, T.zf + 0.8));
  zOut.style.strokeDasharray = `${lenZ} ${lenZ}`; zOut.style.strokeDashoffset = lenZ * (1 - zd); zOut.style.opacity = zd > 0 ? 1 - zfp * 0.9 : 0;
  zPoly.style.opacity = zfp;
  // ---- S
  const sd = E.inOutS(prog(t, T.s0, T.s0 + 1.2)), sfp = E.outC(prog(t, T.sf, T.sf + 0.8));
  sOut.style.strokeDasharray = `${lenS} ${lenS}`; sOut.style.strokeDashoffset = lenS * (1 - sd); sOut.style.opacity = sd > 0 ? 1 - sfp * 0.9 : 0;
  sPath.style.opacity = sfp;
  // ---- acento
  const ap = E.outBack(prog(t, T.acc, T.acc + 0.45)); L.acc.style.opacity = clamp(ap); L.acc.style.transformBox = 'fill-box'; L.acc.style.transformOrigin = 'center'; L.acc.style.transform = `scale(${Math.max(0.01, ap)})`;
  // ---- brillo metálico (dos pasadas)
  let shx = -9999; for (const s0 of [T.hit + 0.4, 9.3]) { const p = prog(t, s0, s0 + 1.5); if (p > 0 && p < 1) shx = lerp(VB.x - 400, VB.x + VB.width + 200, E.inOutS(p)); }
  shineG.setAttribute('x1', shx); shineG.setAttribute('x2', shx + 260); shineG.setAttribute('y1', 150); shineG.setAttribute('y2', 330);
  zSh.style.opacity = zfp; sSh.style.opacity = sfp;
  // ---- ZENTRIX letra por letra
  const n = letters.length, slot = (T.word1 - T.word0) / (n + 1.5);
  letters.forEach((el, i) => { const p = E.outC(prog(t, T.word0 + i * slot, T.word0 + i * slot + slot * 2.5));
    el.style.opacity = p; el.style.transform = `translate(0px, ${(1 - p) * 34}px)`; el.style.filter = p < 1 ? `drop-shadow(0 0 ${10 * (1 - p)}px #3FB4FF)` : 'none'; });
  // ---- STUDIO: líneas crecen desde el centro y letras se acomodan
  const lp = E.inOutS(prog(t, T.stu0, T.stu1));
  L.lines.style.transformOrigin = `${midX}px ${linesBB.y + linesBB.height / 2}px`; L.lines.style.transform = `scaleX(${Math.max(0.001, lp)})`; L.lines.style.opacity = clamp(lp * 3);
  const sp = E.outC(prog(t, T.stu0 + 0.3, T.stu1 + 0.3)); L.stu.style.opacity = sp; L.stu.style.transformOrigin = `${midX}px ${STB.y + STB.height / 2}px`; L.stu.style.transform = `scale(${lerp(1.07, 1, sp)}, 1)`;
  // ---- golpe: destello + onda
  fc.clearRect(0, 0, W, H);
  if (t >= T.hit - 0.15) {
    const e = t - T.hit, r = box.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * 0.36;
    fc.save(); fc.globalCompositeOperation = 'lighter';
    const fl = e < 0 ? (e + 0.15) / 0.15 : Math.exp(-e * 4); if (fl > 0.01) { const gg = fc.createRadialGradient(cx, cy, 0, cx, cy, W * 0.55); gg.addColorStop(0, `rgba(190,225,255,${0.55 * fl})`); gg.addColorStop(1, 'rgba(0,60,255,0)'); fc.fillStyle = gg; fc.fillRect(0, 0, W, H); }
    if (e > 0) { const rr = 60 + e * 900, al = Math.max(0, 0.5 - e * 0.45); if (al > 0) { fc.strokeStyle = `rgba(110,180,255,${al})`; fc.lineWidth = 3 + 12 * Math.exp(-e * 3); fc.beginPath(); fc.ellipse(cx, cy, rr, rr * 0.32, -0.31, 0, 7); fc.stroke(); } }
    fc.restore();
  }
}
async function renderFrame(f) { frame(f / FPS); await new Promise(r => requestAnimationFrame(() => r())); }
window.renderFrame = renderFrame; window.NFRAMES = Math.round(DUR * FPS);
window.ready = Promise.resolve(true);
</script></body></html>
