<script>
const Q = new URLSearchParams(location.search), V = (Q.get('fmt') || 'h') === 'v', PIECE = Q.get('piece') || 'teaser';
const P = window.PD[PIECE], DUR = P.dur, FPS = 60, W = V ? 1080 : 1920, H = V ? 1920 : 1080, CX = W / 2, CY = H / 2, S = V ? 1.0 : 1.0;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const out = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const sceneCv = mk(), accCv = mk(), sc = sceneCv.getContext('2d'), acc = accCv.getContext('2d');
const BLUE = '#1E6BFF', CYAN = '#3FB4FF', DEEP = '#0A35C9', BG = '#07080B';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t, prog = (t, [a, b]) => clamp((t - a) / (b - a));
const E = { outC: t => 1 - Math.pow(1 - t, 3), inOutS: t => -(Math.cos(Math.PI * t) - 1) / 2, outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t), outBack: (t, s = 1.5) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2) };
function hash(n) { let x = (Math.floor(n) | 0) ^ 0x9E3779B9; x = Math.imul(x ^ (x >>> 16), 0x85EBCA6B); x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
// ---------- logo desde el SVG del cliente (completo, solo emblema)
let LOGO, EMB; const VB = [230, 35, 1060, 880.17];
function svgImage(keep) {
  const doc = new DOMParser().parseFromString(window.SVGTXT, 'image/svg+xml'), s = doc.documentElement;
  if (keep) [...s.querySelectorAll('g[id]')].forEach(g => { if (/^0\d-/.test(g.id) && !keep.includes(g.id.slice(0, 2))) g.remove(); });
  s.setAttribute('width', 2120); s.setAttribute('height', 1760);
  return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(s)); });
}
function drawLogo(c, img, cx, cy, w, a = 1) { if (a <= 0) return; const h = w * img.height / img.width; c.save(); c.globalAlpha *= a; c.drawImage(img, cx - w / 2, cy - h / 2, w, h); c.restore(); }
// ---------- fondo común
const PARTS = Array.from({ length: 150 }, (_, i) => [hash(i * 3 + 1), hash(i * 5 + 2), hash(i * 7 + 3), hash(i * 11 + 4)]);
function background(c, t, amt) {
  c.fillStyle = BG; c.fillRect(0, 0, W, H);
  const g = c.createRadialGradient(CX, CY, 10, CX, CY, Math.max(W, H) * 0.75); g.addColorStop(0, `rgba(30,107,255,${0.14 * amt})`); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  // rejilla técnica tenue
  c.save(); c.strokeStyle = `rgba(63,180,255,${0.045 * amt})`; c.lineWidth = 1; const st = 60, off = (t * 8) % st;
  for (let x = -st + off; x < W; x += st) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
  for (let y = -st + off; y < H; y += st) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  c.restore();
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const [a, b, s, k] of PARTS) { const x = ((a * W + t * (10 + 30 * k)) % (W + 40)) - 20, y = ((b * H - t * (5 + 20 * s)) % H + H) % H;
    c.fillStyle = `rgba(90,160,255,${(0.1 + 0.4 * s) * amt * (0.6 + 0.4 * Math.sin(t * 2 + k * 9))})`; c.beginPath(); c.arc(x, y, 1 + 2 * s, 0, 7); c.fill(); }
  c.restore();
}
function orbitRing(c, cx, cy, rx, ry, rot, t, a) {   // órbita decorativa con punto viajando
  if (a <= 0) return; c.save(); c.translate(cx, cy); c.rotate(rot); c.globalAlpha = a;
  c.strokeStyle = 'rgba(30,107,255,0.55)'; c.lineWidth = 3; c.shadowColor = BLUE; c.shadowBlur = 18; c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, 7); c.stroke();
  const ang = t * 1.4, px = Math.cos(ang) * rx, py = Math.sin(ang) * ry; c.shadowBlur = 30; c.shadowColor = CYAN; c.fillStyle = '#fff'; c.beginPath(); c.arc(px, py, 6, 0, 7); c.fill();
  c.restore();
}
function spaced(c, txt, x, y, font, col, tr) {
  c.font = font; const w = [...txt].reduce((s, ch) => s + c.measureText(ch).width, 0) + tr * (txt.length - 1); let xx = x - w / 2;
  c.fillStyle = col; c.textBaseline = 'middle'; c.textAlign = 'left'; for (const ch of txt) { c.fillText(ch, xx, y); xx += c.measureText(ch).width + tr; } return w;
}
function proximamente(c, t, win, cy, size) {
  const p = prog(t, win); if (p <= 0) return;
  const e = E.outC(p), tr = lerp(size * 0.9, size * 0.32, e);
  c.save(); c.globalAlpha *= clamp(p * 1.6); c.shadowColor = BLUE; c.shadowBlur = 30 * (1 - e) + 10;
  spaced(c, 'PRÓXIMAMENTE', CX, cy, `${size}px DispK`, '#F2F3F5', tr); c.restore();
  const lw = lerp(0, V ? 260 : 420, E.inOutS(clamp((p - 0.3) / 0.7))); c.save(); c.globalAlpha *= clamp(p * 2); c.fillStyle = BLUE;
  c.fillRect(CX - lw, cy + size * 0.85, lw * 2, 4); c.restore();
}

// =========================================================== TEASER
const CODE = P.code || [], COLS = { k: '#5AA9FF', w: '#E6EDF3', c: '#7EE0FF', s: '#9BE7A6', f: '#F2C46D', m: '#6B7A90' };
const NCH = CODE.reduce((s, l) => s + l.reduce((a, [, x]) => a + x.length, 0), 0);
function editor(c, t, x, y, w, h, alpha) {
  if (alpha <= 0) return;
  c.save(); c.globalAlpha *= alpha;
  c.shadowColor = 'rgba(30,107,255,0.35)'; c.shadowBlur = 50; rr(c, x, y, w, h, 22); c.fillStyle = '#0D1117'; c.fill(); c.shadowBlur = 0;
  c.strokeStyle = 'rgba(63,180,255,0.35)'; c.lineWidth = 2; c.stroke();
  c.save(); rr(c, x, y, w, 56, 22); c.clip(); c.fillStyle = '#151B23'; c.fillRect(x, y, w, 56); c.restore();
  ['#FF5F57', '#FEBC2E', '#28C840'].forEach((col, i) => { c.fillStyle = col; c.beginPath(); c.arc(x + 32 + i * 26, y + 28, 8, 0, 7); c.fill(); });
  c.font = `${V ? 22 : 22}px Mono`; c.fillStyle = '#8B98A9'; c.textBaseline = 'middle'; c.textAlign = 'center'; c.fillText('tu-app.zentrix.ts', x + w / 2, y + 28);
  const fs = (V ? 30 : 32) * Math.min(1, w / 1300 * (V ? 1.35 : 1)), lh = fs * 1.62, x0 = x + 92 * fs / 32, y0 = y + 56 + 44 * fs / 32;
  c.save(); rr(c, x + 4, y + 58, w - 8, h - 62, 18); c.clip();
  const shown = Math.floor(NCH * E.inOutS(prog(t, P.type)) * 1.0001); let k = 0, cur = null;
  c.textAlign = 'left';
  CODE.forEach((line, li) => {
    const yy = y0 + li * lh; c.font = `${fs}px Mono`; c.fillStyle = '#3B4656'; c.textAlign = 'right'; c.fillText(String(li + 1), x + 60 * fs / 32, yy); c.textAlign = 'left';
    let xx = x0;
    for (const [kind, txt] of line) {
      c.font = `${fs}px ${kind === 'k' || kind === 'f' ? 'MonoB' : 'Mono'}`; c.fillStyle = COLS[kind];
      for (const ch of txt) { if (k >= shown) { if (!cur) cur = [xx, yy]; break; } c.fillText(ch, xx, yy); xx += c.measureText(ch).width; k++; }
      if (k >= shown && !cur) cur = [xx, yy];
    }
    if (k >= shown && !cur) cur = [xx, yy];
  });
  if (!cur) cur = [x0, y0];
  if (Math.floor(t * 2.2) % 2 === 0 || prog(t, P.type) < 1) { c.fillStyle = CYAN; c.fillRect(cur[0] + 2, cur[1] - fs * 0.6, 3, fs * 1.2); }
  c.restore(); c.restore();
}
function phone(c, t, cx, cy, h, wire, color) {
  const w = h * 0.49, x = cx - w / 2, y = cy - h / 2, r = h * 0.07;
  c.save(); c.shadowColor = 'rgba(30,107,255,0.45)'; c.shadowBlur = 50; rr(c, x - 10, y - 10, w + 20, h + 20, r + 8); c.fillStyle = '#10141B'; c.fill(); c.restore();
  c.strokeStyle = 'rgba(160,190,230,0.5)'; c.lineWidth = 2; rr(c, x - 10, y - 10, w + 20, h + 20, r + 8); c.stroke();
  c.save(); rr(c, x, y, w, h, r); c.clip(); c.fillStyle = '#0B0F16'; c.fillRect(x, y, w, h);
  const u = h / 100, blocks = [ // [x,y,w,h,color,radius] en % de la pantalla
    [0, 0, 100, 16, BLUE, 0], [8, 21, 84, 22, 'grad', 4], [8, 47, 40, 15, '#1B2433', 3], [52, 47, 40, 15, '#1B2433', 3], [8, 66, 84, 6, '#1B2433', 2], [8, 75, 84, 6, '#1B2433', 2], [0, 90, 100, 10, '#121925', 0]];
  blocks.forEach(([bx, by, bw, bh, col, br], i) => {
    const X = x + bx / 100 * w, Y = y + by * u, Wd = bw / 100 * w, Hd = bh * u;
    const wp = clamp(wire * 8 - i), cp = clamp(color * 8 - i);
    if (wp > 0) { c.save(); c.globalAlpha = wp; c.setLineDash([8, 6]); c.strokeStyle = 'rgba(120,170,230,0.8)'; c.lineWidth = 2; rr(c, X + 2, Y + 2, Wd - 4, Hd - 4, br * u); c.stroke(); c.restore(); }
    if (cp > 0) { c.save(); c.globalAlpha = cp; rr(c, X + 2, Y + 2, Wd - 4, Hd - 4, br * u);
      if (col === 'grad') { const g = c.createLinearGradient(X, Y, X + Wd, Y + Hd); g.addColorStop(0, CYAN); g.addColorStop(1, DEEP); c.fillStyle = g; } else c.fillStyle = col; c.fill(); c.restore(); }
  });
  if (color > 0.2) { c.save(); c.globalAlpha = clamp((color - 0.2) * 3); c.fillStyle = '#fff'; c.font = `${4.2 * u}px Disp`; c.textBaseline = 'middle'; c.fillText('Tu App', x + 0.08 * w, y + 8 * u);
    c.font = `${3.6 * u}px Disp`; c.fillText('Bienvenido', x + 0.14 * w, y + 30 * u); c.font = `${2.6 * u}px Txt`; c.globalAlpha *= 0.85; c.fillText('Tu negocio en tu bolsillo', x + 0.14 * w, y + 36 * u);
    [17, 58, 83].forEach((px, i) => { c.fillStyle = i === 0 ? CYAN : '#5C6B82'; c.beginPath(); c.arc(x + px / 100 * w, y + 95 * u, 1.6 * u, 0, 7); c.fill(); }); c.restore(); }
  c.restore();
}
function laptop(c, t, cx, cy, w, wire, color) {
  const h = w * 0.6, x = cx - w / 2, y = cy - h / 2;
  c.save(); c.shadowColor = 'rgba(30,107,255,0.4)'; c.shadowBlur = 50; rr(c, x - 14, y - 14, w + 28, h + 28, 16); c.fillStyle = '#10141B'; c.fill(); c.restore();
  c.strokeStyle = 'rgba(160,190,230,0.5)'; c.lineWidth = 2; rr(c, x - 14, y - 14, w + 28, h + 28, 16); c.stroke();
  c.fillStyle = '#1A202A'; c.beginPath(); c.moveTo(x - 80, y + h + 14); c.lineTo(x + w + 80, y + h + 14); c.lineTo(x + w + 50, y + h + 40); c.lineTo(x - 50, y + h + 40); c.closePath(); c.fill();
  c.save(); rr(c, x, y, w, h, 6); c.clip(); c.fillStyle = '#0B0F16'; c.fillRect(x, y, w, h);
  const blocks = [[0, 0, 100, 10, '#121925'], [6, 18, 50, 9, '#E6EDF3'], [6, 30, 36, 5, '#5C6B82'], [6, 40, 20, 8, BLUE], [60, 16, 34, 44, 'grad'], [6, 66, 27, 26, '#1B2433'], [36.5, 66, 27, 26, '#1B2433'], [67, 66, 27, 26, '#1B2433']];
  blocks.forEach(([bx, by, bw, bh, col], i) => {
    const X = x + bx / 100 * w, Y = y + by / 100 * h, Wd = bw / 100 * w, Hd = bh / 100 * h, wp = clamp(wire * 9 - i), cp = clamp(color * 9 - i);
    if (wp > 0) { c.save(); c.globalAlpha = wp; c.setLineDash([8, 6]); c.strokeStyle = 'rgba(120,170,230,0.8)'; c.lineWidth = 2; rr(c, X + 2, Y + 2, Wd - 4, Hd - 4, 6); c.stroke(); c.restore(); }
    if (cp > 0) { c.save(); c.globalAlpha = cp; rr(c, X + 2, Y + 2, Wd - 4, Hd - 4, 6);
      if (col === 'grad') { const g = c.createLinearGradient(X, Y, X + Wd, Y + Hd); g.addColorStop(0, CYAN); g.addColorStop(1, DEEP); c.fillStyle = g; } else c.fillStyle = col; c.fill(); c.restore(); }
  });
  c.restore();
}
function label(c, txt, x, y, a, size) { if (a <= 0) return; c.save(); c.globalAlpha *= a; spaced(c, txt, x, y, `${size}px DispK`, CYAN, size * 0.35); c.restore(); }

function teaser(c, t) {
  const fade = 1 - E.inOutS(prog(t, P.close.fade));
  background(c, t, clamp(t / 1.5) * fade);
  c.save(); c.globalAlpha = fade;
  // 1) logo
  const li = prog(t, P.logo_in), lo = E.inOutS(prog(t, P.logo_out));
  if (li > 0 && lo < 1) {
    const w = (V ? 860 : 900) * lerp(1, 1.6, lo); c.save(); c.globalAlpha *= (1 - lo);
    c.save(); const rev = E.inOutS(li), lw = w, lx = CX - lw / 2; c.beginPath(); c.rect(lx - 50, 0, (lw + 100) * rev, H); c.clip(); drawLogo(c, LOGO, CX, CY, w); c.restore();
    if (rev < 1) { const xx = lerp(lx - 50, lx + lw + 50, rev); const g = c.createLinearGradient(xx - 60, 0, xx + 10, 0); g.addColorStop(0, 'rgba(63,180,255,0)'); g.addColorStop(1, 'rgba(200,230,255,0.9)'); c.globalCompositeOperation = 'lighter'; c.fillStyle = g; c.fillRect(xx - 60, CY - w * 0.45, 70, w * 0.9); }
    c.restore();
  }
  // 2) editor de código
  const B = P.build, eIn = E.outC(prog(t, [P.logo_out[0] + 0.3, P.type[0]])), eOut = E.inOutS(prog(t, B.devices_in));
  const exit = E.inOutS(prog(t, B.out));
  if (eIn > 0 && exit < 1) {
    let ex, ey, ew, eh;
    if (V) { ew = lerp(960, 960, eOut); eh = 640; ex = CX - ew / 2; ey = lerp(CY - eh / 2, 170, eOut); }
    else { ew = lerp(1300, 860, eOut); eh = lerp(640, 470, eOut); ex = lerp(CX - 650, 70, eOut); ey = lerp(CY - 320, 300, eOut); }
    const sc2 = lerp(0.92, 1, eIn); c.save(); c.translate(ex + ew / 2, ey + eh / 2); c.scale(sc2, sc2); c.translate(-(ex + ew / 2), -(ey + eh / 2));
    if (!V && eOut > 0) { c.translate(ex, ey); c.scale(lerp(1, 0.66, 0), 1); c.translate(-ex, -ey); }
    editor(c, t, ex, ey, ew, eh, eIn * (1 - exit)); c.restore();
  }
  // 3) dispositivos: de bocetos a diseño
  const dIn = E.outC(prog(t, B.devices_in)), wire = prog(t, B.wire), col = prog(t, B.color);
  if (dIn > 0 && exit < 1) {
    c.save(); c.globalAlpha *= dIn * (1 - exit);
    if (V) { phone(c, t, CX - 240, 1250 + (1 - dIn) * 120, 600, wire, col); laptop(c, t, CX + 200, 1230 + (1 - dIn) * 160, 380, wire, col);
      label(c, 'APPS', CX - 240, 1610, col, 32); label(c, 'SITIOS WEB', CX + 200, 1610, col, 32); }
    else { phone(c, t, 1150, 560 + (1 - dIn) * 120, 560, wire, col); laptop(c, t, 1560, 540 + (1 - dIn) * 160, 480, wire, col);
      label(c, 'APPS', 1150, 900, col, 32); label(c, 'SITIOS WEB', 1560, 900, col, 32); }
    c.restore();
  }
  // 4) cierre
  const C = P.close, tp = prog(t, C.text), lg = E.outC(prog(t, C.logo));
  if (tp > 0) {
    const tOut = E.inOutS(prog(t, [C.logo[0], C.logo[0] + 0.6])); c.save(); c.globalAlpha *= clamp(tp * 2) * (1 - tOut);
    const msg = 'Algo grande se está construyendo', n = Math.floor(msg.length * E.outC(tp));
    c.font = `${V ? 50 : 58}px Disp`; c.fillStyle = '#E6EDF3'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(msg.slice(0, n), CX, CY + (V ? -40 : -10)); c.restore();
  }
  if (lg > 0) {
    orbitRing(c, CX, V ? CY - 140 : CY - 70, V ? 470 : 640, V ? 150 : 190, -0.31, t, lg * 0.8);
    drawLogo(c, LOGO, CX, V ? CY - 140 : CY - 70, (V ? 760 : 620) * lerp(0.92, 1, lg), lg);
    proximamente(c, t, C.proximamente, V ? CY + 300 : CY + 330, V ? 64 : 72);
  }
  c.restore();
}

// =========================================================== BARRA DE CARGA
function carga(c, t) {
  const fade = 1 - E.inOutS(prog(t, P.fade)); background(c, t, clamp(t / 1.2) * fade);
  c.save(); c.globalAlpha = fade;
  const li = E.outC(prog(t, P.logo_in)), ly = V ? CY - 260 : CY - 150;
  drawLogo(c, LOGO, CX, ly, (V ? 700 : 560) * lerp(0.94, 1, li), li);
  // progreso: avanza con pequeñas pausas y se queda en 87%
  const bp = prog(t, P.bar), steps = [[0, 0], [0.25, 0.31], [0.38, 0.33], [0.62, 0.64], [0.72, 0.66], [1, P.stop / 100]];
  let v = 0; for (let i = 0; i < steps.length - 1; i++) { const [a, va] = steps[i], [b, vb] = steps[i + 1]; if (bp >= a) v = lerp(va, vb, E.inOutS(clamp((bp - a) / (b - a)))); }
  const g0 = prog(t, P.glitch), gl = g0 > 0 && g0 < 1, prox = prog(t, P.prox);
  const bw = V ? 760 : 900, bh = 22, bx = CX - bw / 2, by = V ? CY + 140 : CY + 190;
  const barA = clamp(prog(t, [P.bar[0] - 0.4, P.bar[0]]) * 2) * (1 - E.inOutS(prog(t, [P.prox[0], P.prox[0] + 0.5])));
  if (barA > 0) {
    c.save(); c.globalAlpha *= barA; const jx = gl ? (hash(t * 60 | 0) - 0.5) * 30 : 0;
    rr(c, bx + jx, by, bw, bh, bh / 2); c.strokeStyle = 'rgba(63,180,255,0.6)'; c.lineWidth = 2; c.stroke();
    c.save(); rr(c, bx + jx + 4, by + 4, (bw - 8) * v, bh - 8, (bh - 8) / 2); c.clip();
    const g = c.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, CYAN); g.addColorStop(1, BLUE); c.fillStyle = g; c.fillRect(bx, by, bw, bh);
    c.fillStyle = 'rgba(255,255,255,0.18)'; for (let s = -2; s < bw / 24 + 2; s++) { const sx = bx + s * 24 + (t * 60) % 24; c.beginPath(); c.moveTo(sx, by + bh); c.lineTo(sx + 12, by); c.lineTo(sx + 24, by); c.lineTo(sx + 12, by + bh); c.fill(); }
    c.restore();
    c.shadowColor = CYAN; c.shadowBlur = 24; c.fillStyle = '#fff'; c.beginPath(); c.arc(bx + jx + 4 + (bw - 8) * v, by + bh / 2, 5, 0, 7); c.fill(); c.shadowBlur = 0;
    const pct = Math.round(v * 100); c.font = `${V ? 30 : 30}px Mono`; c.textBaseline = 'middle';
    const txt = gl && hash((t * 30) | 0) > 0.5 ? 'C4RG4ND0 ZΞNTR1X SYST3MS...' : 'CARGANDO ZENTRIX SYSTEMS...';
    c.textAlign = 'left'; c.fillStyle = '#8B98A9'; c.fillText(txt, bx + jx, by - 40); c.textAlign = 'right'; c.fillStyle = '#E6EDF3'; c.font = `${V ? 34 : 34}px MonoB`; c.fillText(pct + '%', bx + bw + jx, by - 40);
    c.restore();
  }
  // glitch: franjas desplazadas y separación RGB
  if (gl) {
    const k = t * 60 | 0; for (let i = 0; i < 6; i++) { const y = hash(k * 7 + i) * H, h = 8 + hash(k * 3 + i) * 40, dx = (hash(k + i * 5) - 0.5) * 80; c.drawImage(c.canvas, 0, y, W, h, dx, y, W, h); }
    c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.25; c.fillStyle = `rgba(30,107,255,${0.3 * hash(k)})`; c.fillRect(0, 0, W, H); c.restore();
  }
  proximamente(c, t, P.prox, by + 10, V ? 66 : 80);
  c.restore();
}
